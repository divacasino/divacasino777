<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0b10; color: #fff; padding-bottom: 70px; }
    
    header { background: #16161e; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222230; position: sticky; top: 0; z-index: 100; }
    .logo-img { height: 32px; object-fit: contain; }
    .header-title { font-size: 15px; font-weight: bold; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }

    .profile-container { padding: 15px; max-width: 500px; margin: 0 auto; }

    .user-card { background: linear-gradient(135deg, #16161e, #1f1f2e); border: 1px solid #222230; border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .user-avatar { width: 65px; height: 65px; background: linear-gradient(135deg, #ff007f, #7928ca); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 10px auto; border: 2px solid #ff007f; }
    .user-id { font-size: 16px; color: #fff; font-weight: 900; margin-bottom: 4px; letter-spacing: 1px; }
    .user-status { font-size: 11px; background: rgba(0, 230, 118, 0.15); color: #00e676; padding: 3px 10px; border-radius: 20px; display: inline-block; font-weight: bold; }

    .balance-box-card { background: #16161e; border: 1px solid #222230; border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .balance-title { font-size: 12px; color: #888; font-weight: bold; text-transform: uppercase; }
    .balance-val { font-size: 20px; font-weight: 900; color: #00e676; }

    .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .action-btn { padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; border: none; cursor: pointer; text-transform: uppercase; transition: opacity 0.2s; }
    .btn-deposit { background: #00c853; color: #fff; }
    .btn-withdraw { background: #ff3d00; color: #fff; }
    .action-btn:active { opacity: 0.8; }

    .menu-card-list { background: #16161e; border: 1px solid #222230; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
    .menu-row { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222230; cursor: pointer; font-size: 13px; font-weight: 600; color: #ccc; transition: background 0.2s; }
    .menu-row:last-child { border-bottom: none; }
    .menu-row:hover { background: #1f1f2e; color: #fff; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #16161e; border-top: 1px solid #222230; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    .nav-item { background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; font-size: 11px; text-decoration: none; gap: 4px; cursor: pointer; }
    .nav-item.active { color: #ff007f; }
    .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
<body>

  <header>
    <img src="https://i.ibb.co/3s6Q14h/image-7.png" alt="Diva Casino Logo" class="logo-img">
    <div class="header-title">Hesabım</div>
    <div style="width: 32px;"></div>
  </header>

  <div class="profile-container">
    <div class="user-card">
      <div class="user-avatar">👤</div>
      <div class="user-id" id="profile-user-id">ID: ----</div>
      <div class="user-status">● Hesab Aktivdir</div>
    </div>

    <div class="balance-box-card">
      <div>
        <div class="balance-title">Cari Balans</div>
        <div style="font-size: 11px; color: #777;">Əsas Hesab</div>
      </div>
      <div class="balance-val" id="profile-balance">0.00 AZN</div>
    </div>

    <div class="action-buttons">
      <button class="action-btn btn-deposit" onclick="alert('Depozit bölməsi tezliklə aktivləşəcək!')">Depozit Et</button>
      <button class="action-btn btn-withdraw" onclick="alert('Çıxarış üçün minimum balans tələbi ödənməlidir.')">Çıxarış</button>
    </div>

    <div class="menu-card-list">
      <div class="menu-row" onclick="alert('Oyun tarixçəsi boşdur.')"><span>🕒 Oyun Tarixçəsi</span><span>›</span></div>
      <div class="menu-row" onclick="alert('Bütün bonuslar artıq balansınıza əlavə olunub.')"><span>🎁 Bonuslar və Aksiyalar</span><span>›</span></div>
      <div class="menu-row" onclick="alert('Təhlükəsizlik səviyyəsi: Yüksək')"><span>🛡️ Təhlükəsizlik və Şifrə</span><span>›</span></div>
      <div class="menu-row" onclick="alert('Dəstək xidməti: support@divacasino.com')"><span>🎧 Dəstək Xidməti (Support)</span><span>›</span></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Əsas səhifə
    </a>
    <a href="index.html" class="nav-item" onclick="localStorage.setItem('open_casino', 'true')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Kazino
    </a>
    <a href="profile.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> Hesabım
    </a>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userId = localStorage.getItem('diva_user_id');
    // Əgər köhnə "USER_..." formatındadısa və ya yoxdursa, 4 rəqəmli yeni ID yarat
    if (!userId || userId.startsWith('USER_')) {
      userId = Math.floor(1000 + Math.random() * 9000).toString();
      localStorage.setItem('diva_user_id', userId);
    }
    document.getElementById('profile-user-id').innerText = "ID: " + userId;

    function updateActivity() {
      db.collection('users').doc(userId).set({ lastActive: Date.now() }, { merge: true });
    }
    updateActivity();
    setInterval(updateActivity, 30000); // Hər 30 saniyədən bir aktivliyi yeniləyir

    db.collection('users').doc(userId).onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        if (data.isBanned) {
          document.body.innerHTML = "<h1 style='color:#ff007f; text-align:center; margin-top:100px;'>HESABINIZ BLOKLANIB!</h1>";
        }
        document.getElementById('profile-balance').innerText = Number(data.balance || 0).toFixed(2) + " AZN";
      } else {
        db.collection('users').doc(userId).set({ balance: 0, winRate: 50, isBanned: false, createdAt: new Date(), lastActive: Date.now() });
      }
    });
  </script>
</body>
</html>
