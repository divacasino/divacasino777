<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - Diva Casino</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0b10; color: #fff; padding-bottom: 30px; text-align: center; }
    
    header { background: #16161e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff007f; }
    .back-btn { background: #222230; color: #fff; border: 1px solid #ff007f; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }

    .profile-container { max-width: 400px; margin: 30px auto; background: #16161e; border-radius: 20px; padding: 25px; border: 2px solid #222230; box-shadow: 0 0 25px rgba(255, 0, 127, 0.2); }
    
    .avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #ff007f; margin-bottom: 15px; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
    .user-id { color: #888; font-size: 14px; font-weight: bold; margin-bottom: 20px; }

    .info-card { background: #0b0b10; border: 1px solid #222230; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; }
    .info-title { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .info-val { font-size: 18px; font-weight: bold; color: #00e676; }

    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .status-active { background: rgba(0, 230, 118, 0.2); color: #00e676; border: 1px solid #00e676; }
    .status-banned { background: rgba(255, 0, 127, 0.2); color: #ff007f; border: 1px solid #ff007f; }

    .action-btn {
      width: 100%; background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #fff; border: none; padding: 12px; border-radius: 12px;
      font-size: 15px; font-weight: bold; cursor: pointer; text-decoration: none; display: block; margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">← Lobby</a>
    <div style="font-weight: bold; color: #ff007f;">ŞƏXSİ HESAB</div>
  </header>

  <div class="profile-container">
    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User Avatar" class="avatar">
    <div class="user-id" id="display-id">ID: Yüklənir...</div>

    <div class="info-card">
      <div class="info-title">Ümumi Balans</div>
      <div class="info-val" id="display-balance">0.00 AZN</div>
    </div>

    <div class="info-card">
      <div class="info-title">Hesab Statusu</div>
      <div id="display-status"><span class="status-badge status-active">Aktiv</span></div>
    </div>

    <a href="index.html" class="action-btn">Oyunlara Qayıt</a>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea",
      measurementId: "G-867WKS9NH7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userId = localStorage.getItem('diva_user_id');
    if (!userId) {
      userId = 'USER_' + Math.floor(100000 + Math.random() * 900000);
      localStorage.setItem('diva_user_id', userId);
    }

    document.getElementById('display-id').innerText = "ID: " + userId;

    db.collection('users').doc(userId).onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        
        if (data.isBanned) {
          document.body.innerHTML = "<h1 style='color:#ff007f; margin-top:100px;'>HESABINIZ BLOKLANIB!</h1><p style='margin-top:10px;'>Administratorla əlaqə saxlayın.</p>";
          return;
        }

        const balance = Number(data.balance || 0).toFixed(2);
        document.getElementById('display-balance').innerText = balance + " AZN";
        
        const statusEl = document.getElementById('display-status');
        if (data.isBanned) {
          statusEl.innerHTML = '<span class="status-badge status-banned">Bloklanıb</span>';
        } else {
          statusEl.innerHTML = '<span class="status-badge status-active">Aktiv</span>';
        }
      } else {
        db.collection('users').doc(userId).set({
          balance: 0,
          winRate: 50,
          isBanned: false,
          createdAt: new Date()
        });
      }
    });
  </script>
</body>
</html>
