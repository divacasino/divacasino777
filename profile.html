<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diva Casino - Hesabım</title>
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0b10; color: #fff; padding-bottom: 80px; }
    
    header { background: #16161e; padding: 15px 20px; text-align: center; border-bottom: 2px solid #ff007f; }
    .logo { font-size: 20px; font-weight: bold; color: #ff007f; letter-spacing: 1px; }
    
    .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
    .card { background: #16161e; border-radius: 14px; padding: 20px; border: 1px solid #222230; margin-bottom: 15px; }
    .card-title { font-size: 14px; color: #888; margin-bottom: 15px; text-transform: uppercase; font-weight: bold; }
    
    .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222230; font-size: 14px; }
    .info-row:last-child { border: none; }
    .val { color: #ff007f; font-weight: bold; }
    
    .notice-box {
      background: rgba(255, 0, 127, 0.05);
      border: 1px dashed #ff007f;
      border-radius: 10px;
      padding: 15px;
      font-size: 13px;
      color: #ccc;
      line-height: 1.5;
    }

    /* Naviqasiya Barı */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #16161e; display: flex; justify-content: space-around;
      padding: 12px 0; border-top: 1px solid #222230;
    }
    .nav-link { color: #777; text-decoration: none; font-size: 11px; text-align: center; font-weight: bold; width: 50%; }
    .nav-link.active { color: #ff007f; }
    .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">ŞƏXSİ HESAB</div>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-title">Hesab Məlumatları</div>
      <div class="info-row">
        <span>İstifadəçi Kodu (ID):</span>
        <span class="val" id="user-id-val">Yüklənir...</span>
      </div>
      <div class="info-row">
        <span>Cari Balans:</span>
        <span class="val" id="balance-val">0.00 AZN</span>
      </div>
      <div class="info-row">
        <span>Status:</span>
        <span style="color:#00e676; font-weight:bold;">Aktiv İstifadəçi</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Balans Əməliyyatları</div>
      <div class="notice-box">
        Balans artırmaq və ya uduşlarınızı nəğdləşdirmək üçün administratora yuxarıda göstərilən <b>İstifadəçi Kodunuzu (ID)</b> təqdim edin.
      </div>
    </div>
  </div>

  <!-- Alt Menyu -->
  <nav>
    <a href="index.html" class="nav-link">
      <span class="nav-icon">🎮</span> Oyunlar
    </a>
    <a href="profile.html" class="nav-link active">
      <span class="nav-icon">👤</span> Hesabım
    </a>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea",
      measurementId: "G-867WKS9NH7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Sabit İstifadəçi ID-si Oxumaq
    let userId = localStorage.getItem('diva_user_id');
    if (!userId) {
      userId = 'USER_' + Math.floor(100000 + Math.random() * 900000);
      localStorage.setItem('diva_user_id', userId);
    }

    document.getElementById('user-id-val').innerText = userId;

    // Bazadan məlumatları çəkmək
    db.collection('users').doc(userId).onSnapshot(doc => {
      if (doc.exists) {
        const bal = doc.data().balance || 0;
        document.getElementById('balance-val').innerText = Number(bal).toFixed(2) + " AZN";
      }
    });
  </script>
</body>
</html>
