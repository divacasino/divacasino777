<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diva Casino - Əsas Səhifə</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0b10; color: #fff; padding-bottom: 70px; }
    
    header {
      background: #16161e; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #222230; position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo-img { height: 32px; object-fit: contain; }

    .user-info-box { display: flex; align-items: center; gap: 10px; }
    .balance-container { display: flex; flex-direction: column; text-align: right; }
    .currency-label { font-size: 10px; color: #888; font-weight: bold; }
    .balance-amount { font-size: 15px; font-weight: 900; color: #00e676; }

    .deposit-btn {
      background: #00c853; color: #fff; border: none; padding: 6px 12px;
      border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer;
    }

    .notif-box { position: relative; background: #222230; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #ff3d00; border-radius: 50%; display: none; }

    /* Daha Kiçik Reklam Panosu */
    .promo-banner {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      margin: 10px 15px; padding: 6px 12px; border-radius: 8px; text-align: center;
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(255, 0, 127, 0.2);
    }

    /* Real Canlı Uduşlar Lentəsi */
    .live-wins-ticker {
      background: #16161e; margin: 0 15px 15px 15px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid #222230; display: flex; align-items: center; justify-content: space-between; font-size: 12px;
    }
    .live-win-user { color: #aaa; font-weight: bold; }
    .live-win-val { color: #00e676; font-weight: 900; }

    .section-title { font-size: 14px; font-weight: bold; margin: 15px 15px 8px 15px; color: #aaa; text-transform: uppercase; }
    .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 15px; }
    
    .game-card {
      background: #16161e; border: 1px solid #222230; border-radius: 12px; overflow: hidden;
      text-decoration: none; color: #fff; transition: transform 0.2s, border-color 0.2s; text-align: center;
    }
    .game-card:hover { border-color: #ff007f; }
    .game-img { width: 100%; height: 100px; background-size: cover; background-position: center; }
    .game-name { padding: 10px; font-size: 13px; font-weight: bold; }

    /* Aşağı Naviqasiya Paneli */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #16161e;
      border-top: 1px solid #222230; display: flex; justify-content: space-around;
      padding: 8px 0; z-index: 1000;
    }
    .nav-item {
      background: none; border: none; color: #888; display: flex; flex-direction: column;
      align-items: center; font-size: 11px; text-decoration: none; gap: 4px; cursor: pointer;
    }
    .nav-item.active { color: #ff007f; }
    .nav-item svg { width: 20px; height: 20px; fill: currentColor; }

    /* Popup Modal Stili (Şəkil və Yazı Dəstəyi ilə) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 2000;
    }
    .modal-box { background: #16161e; border: 1px solid #ff007f; width: 90%; max-width: 340px; border-radius: 14px; padding: 20px; text-align: center; max-height: 80vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: bold; color: #ff007f; margin-bottom: 12px; }
    .modal-content { font-size: 13px; color: #ccc; margin-bottom: 20px; line-height: 1.5; text-align: left; }
    .modal-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; display: none; }
    .close-modal-btn { background: #ff007f; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Yuxarı Header -->
  <header>
    <div class="header-left">
      <img src="https://i.ibb.co/3s6Q14h/image-7.png" alt="Diva Casino Logo" class="logo-img">
    </div>
    <div class="user-info-box">
      <div class="balance-container">
        <span class="currency-label" id="user-id-display">ID: ...</span>
        <span class="balance-amount" id="header-balance">0.00 AZN</span>
      </div>
      <button class="deposit-btn" onclick="alert('Depozit bölməsi tezliklə aktivləşəcək!')">Depozit</button>
      <div class="notif-box" onclick="openNotifications()">
        <span class="notif-dot" id="notif-indicator"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      </div>
    </div>
  </header>

  <!-- Kiçildilmiş Reklam Panosu -->
  <div class="promo-banner" id="promo-text">
    🔥 CASH'İN FRUITS: 25X UDUŞ ŞANSI! 🔥
  </div>

  <!-- Real Canlı Uduşlar Lentəsi -->
  <div class="live-wins-ticker">
    <span style="font-size: 10px; color: #ff007f; font-weight: bold;">🔴 CANLI UDUŞ</span>
    <span class="live-win-user" id="live-user">USER_-----</span>
    <span class="live-win-val" id="live-amount">0.00 AZN</span>
  </div>

  <!-- Səhifə Məzmunu -->
  <div id="page-content">
    <div class="section-title">Populyar Slotlar</div>
    <div class="games-grid">
      <a href="slot1.html" class="game-card">
        <div class="game-img" style="background-image: url('https://i.ibb.co/6R2145v/image-4.png');"></div>
        <div class="game-name">Cash'in Fruits 100</div>
      </a>
    </div>
  </div>

  <!-- Aşağı Naviqasiya Paneli -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Əsas səhifə
    </button>
    <button class="nav-item" onclick="switchTab('casino')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      Kazino
    </button>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Hesabım
    </a>
  </nav>

  <!-- Bildirişlər Popup Modal (Admin tərəfindən idarə olunur) -->
  <div class="modal-overlay" id="notif-modal">
    <div class="modal-box">
      <div class="modal-title" id="admin-notif-title">Bildirişlər</div>
      <img id="admin-notif-img" class="modal-img" src="" alt="Bildiriş Şəkli">
      <div class="modal-content" id="admin-notif-text">
        Yeni bildiriş yoxdur.
      </div>
      <button class="close-modal-btn" onclick="closeNotifications()">Bağla</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userId = localStorage.getItem('diva_user_id');
    if (!userId) {
      userId = 'USER_' + Math.floor(100000 + Math.random() * 900000);
      localStorage.setItem('diva_user_id', userId);
    }
    document.getElementById('user-id-display').innerText = userId;

    // Balansı izləmə
    db.collection('users').doc(userId).onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        if (data.isBanned) {
          document.body.innerHTML = "<h1 style='color:#ff007f; text-align:center; margin-top:100px;'>HESABINIZ BLOKLANIB!</h1>";
          return;
        }
        document.getElementById('header-balance').innerText = Number(data.balance || 0).toFixed(2) + " AZN";
      } else {
        db.collection('users').doc(userId).set({ balance: 0, winRate: 50, isBanned: false, createdAt: new Date() });
      }
    });

    // Admin tərəfindən göndərilən bildirişləri yoxlamaq üçün listener
    db.collection('settings').doc('notification').onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        if (data.text || data.imageUrl) {
          document.getElementById('admin-notif-title').innerText = data.title || "Xüsusi Bildiriş";
          document.getElementById('admin-notif-text').innerText = data.text || "";
          
          const imgElement = document.getElementById('admin-notif-img');
          if (data.imageUrl && data.imageUrl.trim() !== "") {
            imgElement.src = data.imageUrl;
            imgElement.style.display = 'block';
          } else {
            imgElement.style.display = 'none';
          }
          
          // Yeni bildiriş olduqda qırmızı nöqtəni yandırırıq
          document.getElementById('notif-indicator').style.display = 'block';
        }
      }
    });

    // Real Canlı Uduşları Bazadan Oxumaq
    db.collection('users').onSnapshot(snapshot => {
      let usersList = [];
      snapshot.forEach(doc => {
        let d = doc.data();
        usersList.push({ id: doc.id, balance: d.balance || 0 });
      });
      if (usersList.length > 0) {
        let randomUser = usersList[Math.floor(Math.random() * usersList.length)];
        let randomWin = (Math.random() * 15 + 1).toFixed(2);
        document.getElementById('live-user').innerText = randomUser.id;
        document.getElementById('live-amount').innerText = `+${randomWin} AZN`;
      }
    });

    function switchTab(tab) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const content = document.getElementById('page-content');
      
      if(tab === 'home') {
        document.querySelectorAll('.nav-item')[0].classList.add('active');
        content.innerHTML = `
          <div class="section-title">Populyar Slotlar</div>
          <div class="games-grid">
            <a href="slot1.html" class="game-card">
              <div class="game-img" style="background-image: url('https://i.ibb.co/6R2145v/image-4.png');"></div>
              <div class="game-name">Cash'in Fruits 100</div>
            </a>
          </div>
        `;
      } else if(tab === 'casino') {
        document.querySelectorAll('.nav-item')[1].classList.add('active');
        content.innerHTML = `
          <div class="section-title">Bütün Kazino Oyunları</div>
          <div class="games-grid">
            <a href="slot1.html" class="game-card">
              <div class="game-img" style="background-image: url('https://i.ibb.co/6R2145v/image-4.png');"></div>
              <div class="game-name">Cash'in Fruits 100</div>
            </a>
          </div>
        `;
      }
    }

    function openNotifications() {
      document.getElementById('notif-modal').style.display = 'flex';
      // Bildirişə baxıldıqdan sonra qırmızı nöqtəni söndürürük
      document.getElementById('notif-indicator').style.display = 'none';
    }
    function closeNotifications() {
      document.getElementById('notif-modal').style.display = 'none';
    }

    const promos = [
      "🔥 CASH'İN FRUITS: 25X UDUŞ ŞANSI! 🔥",
      "💎 7️⃣ SİMVOLLARI İLƏ QAZANCINI ARTIR! 💎"
    ];
    let pIdx = 0;
    setInterval(() => {
      pIdx = (pIdx + 1) % promos.length;
      document.getElementById('promo-text').innerText = promos[pIdx];
    }, 4000);
  </script>
</body>
</html>
