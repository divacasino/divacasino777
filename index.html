<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diva Casino</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f0f13; color: #fff; padding-bottom: 70px; }
    
    /* Yuxarı Panel (Header) */
    header {
      background: #181820;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ff007f;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 22px; font-weight: bold; color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }
    
    /* DIV Balans Container */
    .balance-box {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 2px 10px rgba(255, 0, 127, 0.3);
    }

    /* Oyunlar Bölməsi (Lobby) */
    .container { padding: 20px; max-width: 800px; margin: 0 auto; }
    .section-title { font-size: 18px; margin-bottom: 15px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
    }
    .game-card {
      background: #1e1e28;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a38;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      text-align: center;
      padding: 15px 10px;
    }
    .game-card:hover { transform: translateY(-5px); border-color: #ff007f; }
    .game-icon { font-size: 45px; margin-bottom: 10px; }
    .game-title { font-size: 14px; font-weight: bold; color: #ddd; }

    /* Alt Naviqasiya (Hesab Menyusu) */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #181820;
      display: flex; justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid #2a2a38;
    }
    .nav-item { color: #888; text-decoration: none; font-size: 12px; text-align: center; cursor: pointer; }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; display: block; margin-bottom: 3px; }

    /* Oyun və Hesab Səhifəsi Modalı */
    .view-page { display: none; }
    .view-page.active { display: block; }
    
    /* Hesab Pəncərəsi */
    .profile-card {
      background: #1e1e28;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      border: 1px solid #2a2a38;
    }
    .profile-info { margin-bottom: 12px; font-size: 14px; color: #ccc; }
    .profile-info span { color: #ff007f; font-weight: bold; }
    
    /* Geriyə Düyməsi */
    .back-btn {
      background: #2a2a38; color: #fff; border: none; padding: 8px 15px;
      border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header / Balans -->
  <header>
    <div class="logo">DIVA CASINO</div>
    <div class="balance-box"><span id="balance-val">0</span> DIV</div>
  </header>

  <div class="container">
    
    <!-- 1. ƏSAS SƏHİFƏ (LOBBY) -->
    <div id="page-lobby" class="view-page active">
      <div class="section-title">Populyar Slot Oyunları</div>
      <div class="games-grid">
        
        <!-- Oyun 1 -->
        <div class="game-card" onclick="openGame('Meyvə Slotu v1')">
          <div class="game-icon">🎰</div>
          <div class="game-title">Meyvə Slotu</div>
        </div>

        <!-- Oyun 2 (Gələcək üçün) -->
        <div class="game-card" onclick="openGame('VIP Fruit Spin')">
          <div class="game-icon">🍓</div>
          <div class="game-title">VIP Fruit Spin</div>
        </div>

        <!-- Oyun 3 (Gələcək üçün) -->
        <div class="game-card" onclick="openGame('Mega Cocktail')">
          <div class="game-icon">🍹</div>
          <div class="game-title">Mega Cocktail</div>
        </div>

      </div>
    </div>

    <!-- 2. OYUN SƏHİFƏSİ (Oyun kliklənəndə bura açılacaq) -->
    <div id="page-game" class="view-page">
      <button class="back-btn" onclick="showPage('lobby')">← Lobbiyə Qayıt</button>
      <h2 id="current-game-title" style="color:#ff007f; margin-bottom:15px;">Oyun</h2>
      
      <div style="background:#1e1e28; padding:30px; text-align:center; border-radius:12px; border:1px solid #ff007f;">
        <p style="color:#aaa; font-size:14px;">[ Bura fırlanma animasiyalı, xətləri görünən real slot mexanizmini yerləşdirəcəyik ]</p>
      </div>
    </div>

    <!-- 3. HESAB (PROFILE) SƏHİFƏSİ -->
    <div id="page-profile" class="view-page">
      <div class="section-title">Hesab Məlumatları</div>
      <div class="profile-card">
        <div class="profile-info">Hesab IP Ünvanı: <span id="user-ip">Yüklənir...</span></div>
        <div class="profile-info">Cari Balans: <span id="profile-balance">0</span> DIV</div>
        <div class="profile-info">Status: <span style="color:#00e676;">Aktiv İstifadəçi</span></div>
      </div>
    </div>

  </div>

  <!-- Alt Naviqasiya Menyusu -->
  <nav>
    <div class="nav-item active" id="nav-lobby" onclick="showPage('lobby')">
      <span class="nav-icon">🎮</span> Oyunlar
    </div>
    <div class="nav-item" id="nav-profile" onclick="showPage('profile')">
      <span class="nav-icon">👤</span> Hesabım
    </div>
  </nav>

  <script>
    // Firebase Konfiqurasiyası
    const firebaseConfig = {
      apiKey: "SƏNİN_API_KEY",
      authDomain: "SƏNİN_AUTH_DOMAIN",
      projectId: "SƏNİN_PROJECT_ID",
      storageBucket: "SƏNİN_STORAGE_BUCKET",
      messagingSenderId: "SƏNİN_MESSAGING_ID",
      appId: "SƏNİN_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentIP = "";
    let currentBalance = 0;

    // IP almaq və Balans Yükləmək
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => {
        currentIP = data.ip.replaceAll('.', '_');
        document.getElementById('user-ip').innerText = data.ip;
        loadUserBalance();
      });

    function loadUserBalance() {
      const userRef = db.collection('users').doc(currentIP);
      userRef.onSnapshot(doc => {
        if (doc.exists) {
          currentBalance = doc.data().balance;
        } else {
          currentBalance = 100; // Başlanğıc hədiyyə balans
          userRef.set({ balance: currentBalance, createdAt: new Date() });
        }
        document.getElementById('balance-val').innerText = currentBalance;
        document.getElementById('profile-balance').innerText = currentBalance;
      });
    }

    // Səhifələrarası Keçid Sistemi
    function showPage(pageName) {
      document.querySelectorAll('.view-page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      if (pageName === 'lobby') {
        document.getElementById('page-lobby').classList.add('active');
        document.getElementById('nav-lobby').classList.add('active');
      } else if (pageName === 'profile') {
        document.getElementById('page-profile').classList.add('active');
        document.getElementById('nav-profile').classList.add('active');
      }
    }

    // Oyuna Daxil Olmaq
    function openGame(gameName) {
      document.querySelectorAll('.view-page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-game').classList.add('active');
      document.getElementById('current-game-title').innerText = gameName;
    }
  </script>
</body>
</html>
