<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diva Casino - Əsas Səhifə</title>
  
  <!-- Ana ekrana əlavə edildikdə tətbiq ikonu kimi görünməsi üçün PWA & Apple Touch meta teqləri -->
  <link rel="icon" type="image/png" href="logo.png.PNG">
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png.PNG">
  <link rel="apple-touch-icon-precomposed" href="logo.png.PNG">
  <link rel="shortcut icon" href="logo.png.PNG">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Diva Casino">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b0b10; color: #ffffff; padding-bottom: 75px; overflow-x: hidden; }

    /* Yuxarı Header */
    header { background: #16161e; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222230; position: sticky; top: 0; z-index: 1000; height: 60px; }
    
    .logo-container { display: flex; align-items: center; }
    .logo-img { height: 38px; max-width: 130px; object-fit: contain; }

    .user-panel { display: flex; align-items: center; gap: 12px; }
    .balance-box { text-align: right; }
    .user-id-txt { font-size: 11px; color: #8888a0; font-weight: 700; letter-spacing: 0.5px; }
    .user-bal-txt { font-size: 15px; font-weight: 900; color: #00e676; }

    .deposit-btn { background: #00c853; color: #ffffff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .deposit-btn:active { transform: scale(0.95); opacity: 0.9; }

    .notif-btn { background: #222230; border: none; color: #ffffff; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .notif-btn svg { width: 18px; height: 18px; fill: #ffffff; }

    .container { padding: 15px; max-width: 600px; margin: 0 auto; }

    /* Bənövşəyi Banner */
    .promo-banner { background: linear-gradient(90deg, #d500f9, #7c4dff); border-radius: 12px; padding: 12px 15px; text-align: center; font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #fff; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(213, 0, 249, 0.3); }

    /* Canlı Uduş Paneli */
    .live-wins { background: #16161e; border: 1px solid #222230; border-radius: 10px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 12px; font-weight: bold; }
    .live-tag { color: #ff3d00; display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .live-dot { width: 8px; height: 8px; background: #ff3d00; border-radius: 50%; animation: blink 1s infinite alternate; }
    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
    .live-user { color: #aaa; }
    .live-amount { color: #00e676; font-weight: 900; }

    /* Oyunlar Bölməsi */
    .section-title { font-size: 14px; font-weight: 900; color: #8888a0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    /* Oyun Kartları */
    .game-card { background: #16161e; border: 1px solid #222230; border-radius: 12px; overflow: hidden; position: relative; text-decoration: none; color: #fff; transition: 0.2s; display: flex; flex-direction: column; }
    .game-card:active { transform: scale(0.97); }
    
    .game-thumb-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; background: #222230; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .game-thumb { width: 100%; height: 100%; object-fit: cover; }

    .game-title { padding: 10px; font-size: 13px; font-weight: 800; text-align: center; background: #16161e; color: #ffffff; }

    /* Tezliklə Oyun Kartları (Boz) */
    .coming-soon-card { opacity: 0.75; cursor: not-allowed; }
    .coming-soon-bg { background: #252533; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #555; font-weight: 900; }
    .badge-coming { position: absolute; top: 10px; right: 10px; background: rgba(255, 0, 127, 0.9); color: #fff; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }

    /* Aşağı Naviqasiya */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #16161e; border-top: 1px solid #222230; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    .nav-item { background: none; border: none; color: #8888a0; display: flex; flex-direction: column; align-items: center; font-size: 11px; text-decoration: none; gap: 4px; cursor: pointer; width: 33%; font-weight: 700; }
    .nav-item.active { color: #ff007f; }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Yuxarı Panel -->
  <header>
    <div class="logo-container">
      <img src="logo.png.PNG" alt="Diva Casino" class="logo-img" onerror="this.onerror=null; this.src='logo.png.PNG';">
    </div>
    <div class="user-panel">
      <div class="balance-box">
        <div class="user-id-txt">ID: <span id="display-user-id">----</span></div>
        <div class="user-bal-txt" id="display-user-balance">0.00 AZN</div>
      </div>
      <button class="deposit-btn" onclick="alert('Depozit bölməsi tezliklə aktiv olacaq!')">Depozit</button>
      <button class="notif-btn" onclick="alert('Yeni bildirişiniz yoxdur.')">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      </button>
    </div>
  </header>

  <div class="container">
    
    <!-- Reklam Banneri (Yalnız Əsas səhifədə görünür) -->
    <div class="promo-banner" id="main-banner">
      💎 7 SİMVOLLARI İLƏ QAZANCINI ARTIR! 💎
    </div>

    <!-- Canlı Uduşlar Paneli (Yalnız Əsas səhifədə görünür) -->
    <div class="live-wins" id="live-wins-box">
      <div class="live-tag"><span class="live-dot"></span> CANLI UDUŞ</div>
      <div class="live-user" id="live-username">USER_157070</div>
      <div class="live-amount" id="live-win-amount">+4.36 AZN</div>
    </div>

    <!-- Oyunlar Siyahısı -->
    <div class="section-title" id="games-section-title">POPULYAR SLOTLAR</div>
    
    <div class="games-grid">
      
      <!-- 1-ci Oyun: Cash'in Fruits 100 -->
      <a href="slot1.html" class="game-card">
        <div class="game-thumb-wrapper">
          <img src="slot1.png" alt="Cash'in Fruits 100" class="game-thumb" onerror="this.src='logo.png.PNG';">
        </div>
        <div class="game-title">Cash'in Fruits 100</div>
      </a>

      <!-- 2-ci Oyun (Tezliklə) -->
      <div class="game-card coming-soon-card" onclick="alert('Bu oyun tezliklə istifadəyə veriləcək!')">
        <div class="game-thumb-wrapper">
          <div class="coming-soon-bg">🎰</div>
          <span class="badge-coming">Tezliklə</span>
        </div>
        <div class="game-title">...</div>
      </div>

      <!-- 3-cü Oyun (Tezliklə) -->
      <div class="game-card coming-soon-card" onclick="alert('Bu oyun tezliklə istifadəyə veriləcək!')">
        <div class="game-thumb-wrapper">
          <div class="coming-soon-bg">🎲</div>
          <span class="badge-coming">Tezliklə</span>
        </div>
        <div class="game-title">...</div>
      </div>

      <!-- 4-cü Oyun (Tezliklə) -->
      <div class="game-card coming-soon-card" onclick="alert('Bu oyun tezliklə istifadəyə veriləcək!')">
        <div class="game-thumb-wrapper">
          <div class="coming-soon-bg">🃏</div>
          <span class="badge-coming">Tezliklə</span>
        </div>
        <div class="game-title">...</div>
      </div>

    </div>

  </div>

  <!-- Aşağı Naviqasiya Paneli -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Əsas səhifə
    </button>
    <button class="nav-item" id="nav-casino" onclick="switchTab('casino')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      Kazino
    </button>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Hesabım
    </a>
  </nav>

  <script>
    // Firebase Konfiqurasiyası
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // İstifadəçi ID Məntiqi
    let userId = localStorage.getItem('diva_user_id');
    if (!userId || userId.startsWith('USER_')) {
      userId = Math.floor(1000 + Math.random() * 9000).toString();
      localStorage.setItem('diva_user_id', userId);
    }
    document.getElementById('display-user-id').innerText = userId;

    // Aktivliyi yenilə
    function updateActivity() {
      db.collection('users').doc(userId).set({
        lastActive: Date.now(),
        currentGame: "Ana Səhifə"
      }, { merge: true });
    }
    updateActivity();
    setInterval(updateActivity, 30000);

    // Balans və Status Dinamik Yüklənməsi
    db.collection('users').doc(userId).onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        if (data.isBanned) {
          document.body.innerHTML = "<div style='color:#ff007f;text-align:center;padding-top:150px;font-size:22px;font-weight:900;'>HESABINIZ BLOKLANIB!</div>";
          return;
        }
        const bal = parseFloat(data.balance) || 0;
        document.getElementById('display-user-balance').innerText = bal.toFixed(2) + " AZN";
      } else {
        db.collection('users').doc(userId).set({
          balance: 0,
          winRate: 50,
          isBanned: false,
          lastActive: Date.now(),
          currentGame: "Ana Səhifə"
        });
      }
    });

    // Canlı Uduşlar İmitasiyası
    const fakeUsers = ["USER_8812", "USER_3490", "USER_9921", "USER_1102", "USER_5541"];
    setInterval(() => {
      const u = fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
      const a = (Math.random() * 15 + 1).toFixed(2);
      document.getElementById('live-username').innerText = u;
      document.getElementById('live-win-amount').innerText = `+${a} AZN`;
    }, 4000);

    // Naviqasiya Keçid Məntiqi (Əsas səhifə / Kazino)
    function switchTab(tab) {
      const banner = document.getElementById('main-banner');
      const liveBox = document.getElementById('live-wins-box');
      const title = document.getElementById('games-section-title');
      const btnHome = document.getElementById('nav-home');
      const btnCasino = document.getElementById('nav-casino');

      if (tab === 'casino') {
        banner.classList.add('hidden');
        liveBox.classList.add('hidden');
        title.innerText = "KAZİNO OYUNLARI";
        btnHome.classList.remove('active');
        btnCasino.classList.add('active');
      } else {
        banner.classList.remove('hidden');
        liveBox.classList.remove('hidden');
        title.innerText = "POPULYAR SLOTLAR";
        btnCasino.classList.remove('active');
        btnHome.classList.add('active');
      }
    }
  </script>
</body>
</html>
