<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diva Casino</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #ff007f; text-transform: uppercase; margin-bottom: 5px; }
    .ip-info { font-size: 12px; color: #888; margin-bottom: 20px; }
    
    /* DIV Balans Sistemi */
    #div-balance {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      display: inline-block;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
    }

    /* Meyvə Slot Masası */
    .slot-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }
    .reel {
      width: 80px;
      height: 80px;
      background: #222;
      border: 3px solid #ff007f;
      border-radius: 12px;
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fırlat Düyməsi */
    button {
      background: #00e676;
      color: #000;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    #message { margin-top: 15px; font-weight: bold; min-height: 24px; }
  </style>
</head>
<body>

  <h1>Diva Casino</h1>
  <div class="ip-info">IP Ünvanınız: <span id="user-ip">Yüklənir...</span></div>

  <!-- Balans Div Container -->
  <div id="div-balance">Balans: <span id="balance-val">0</span> DIV</div>

  <!-- Slot Oyunu -->
  <div class="slot-container">
    <div class="reel" id="reel1">🍇</div>
    <div class="reel" id="reel2">🍉</div>
    <div class="reel" id="reel3">🍊</div>
  </div>

  <button id="spin-btn" onclick="spin()" disabled>FIRLAT (10 DIV)</button>
  <div id="message"></div>

  <script>
    // 1. SƏNİN FIREBASE KONFİQURASİYAN
    const firebaseConfig = {
      // BURAYA KOPYALADIĞIN KODLARI YAPIŞDIR
      apiKey: "SƏNİN_API_KEY",
      authDomain: "SƏNİN_AUTH_DOMAIN",
      projectId: "SƏNİN_PROJECT_ID",
      storageBucket: "SƏNİN_STORAGE_BUCKET",
      messagingSenderId: "SƏNİN_MESSAGING_ID",
      appId: "SƏNİN_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const fruits = ['🍇', '🍉', '🍊', '🍋', '🍌', '🍒'];
    let currentIP = "";
    let currentBalance = 0;

    // 2. IP Ünvanını al və Bazaya Bağlan
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => {
        currentIP = data.ip.replaceAll('.', '_'); // Firestore ID üçün nöqtələri dəyişirik
        document.getElementById('user-ip').innerText = data.ip;
        loadUserBalance();
      })
      .catch(() => {
        document.getElementById('message').innerText = "IP xətası baş verdi.";
      });

    // 3. Balansı Firebase-dən Yüklə / Daxil Et
    function loadUserBalance() {
      const userRef = db.collection('users').doc(currentIP);

      userRef.onSnapshot(doc => {
        if (doc.exists) {
          currentBalance = doc.data().balance;
        } else {
          // Yeni istifadəçiyə hədiyyə 100 DIV balans
          currentBalance = 100;
          userRef.set({ balance: currentBalance, createdAt: new Date() });
        }
        document.getElementById('balance-val').innerText = currentBalance;
        document.getElementById('spin-btn').disabled = false;
      });
    }

    // 4. Meyvə Slot Oyun Mexanizmi
    function spin() {
      if (currentBalance < 10) {
        document.getElementById('message').innerText = "Kafi balans yoxdur! Adminlə əlaqə saxlayın.";
        return;
      }

      document.getElementById('spin-btn').disabled = true;
      currentBalance -= 10;
      updateBalanceInDB(currentBalance);

      const r1 = fruits[Math.floor(Math.random() * fruits.length)];
      const r2 = fruits[Math.floor(Math.random() * fruits.length)];
      const r3 = fruits[Math.floor(Math.random() * fruits.length)];

      document.getElementById('reel1').innerText = r1;
      document.getElementById('reel2').innerText = r2;
      document.getElementById('reel3').innerText = r3;

      if (r1 === r2 && r2 === r3) {
        const winAmount = 100;
        currentBalance += winAmount;
        updateBalanceInDB(currentBalance);
        document.getElementById('message').innerText = `TƏBRİKLƏR! +${winAmount} DIV qazandınız! 🎉`;
      } else {
        document.getElementById('message').innerText = "Bəxtinizi bir daha sınayın!";
      }

      document.getElementById('spin-btn').disabled = false;
    }

    function updateBalanceInDB(newBalance) {
      db.collection('users').doc(currentIP).update({ balance: newBalance });
    }
  </script>
</body>
</html>
