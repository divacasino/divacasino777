<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0b10; color: #fff; padding-bottom: 70px; }
    
    /* Yuxarı Header (1-ci şəkil formatı) */
    header {
      background: #16161e; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #222230; position: sticky; top: 0; z-index: 100;
    }
    .user-info-box { display: flex; align-items: center; gap: 12px; }
    .balance-container { display: flex; flex-direction: column; }
    .currency-label { font-size: 11px; color: #888; display: flex; align-items: center; gap: 4px; font-weight: bold; }
    .balance-amount { font-size: 17px; font-weight: 900; color: #fff; }

    .deposit-btn {
      background: #00c853; color: #fff; border: none; padding: 8px 16px;
      border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer;
      box-shadow: 0 2px 10px rgba(0, 200, 83, 0.3); transition: transform 0.1s;
    }
    .deposit-btn:active { transform: scale(0.96); }

    .notif-box { position: relative; background: #222230; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .notif-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: #ff3d00; border-radius: 50%; box-shadow: 0 0 6px #ff3d00; }

    /* Animasiyalı Reklam Panosu */
    .promo-banner {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      margin: 15px; padding: 18px; border-radius: 14px; text-align: center;
      overflow: hidden; position: relative; box-shadow: 0 4px 20px rgba(255, 0, 127, 0.3);
    }
    .promo-slider { font-size: 18px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; animation: promoPulse 2s infinite alternate; }
    @keyframes promoPulse {
      0% { transform: scale(1); text-shadow: 0 0 5px rgba(255,255,255,0.5); }
      100% { transform: scale(1.03); text-shadow: 0 0 15px rgba(255,255,255,0.9); }
    }

    /* Canlı Uduşlar Lentəsi */
    .live-wins-ticker {
      background: #16161e; margin: 0 15px 15px 15px; padding: 10px 14px; border-radius: 10px;
      border: 1px solid #222230; display: flex; align-items: center; justify-content: space-between; font-size: 13px;
    }
    .live-win-user { color: #aaa; font-weight: bold; }
    .live-win-val { color: #00e676; font-weight: 900; }

    /* Əsas Məzmun / Oyunlar */
    .section-title { font-size: 15px; font-weight: bold; margin: 20px 15px 10px 15px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
    .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 15px; }
    
    .game-card {
      background: #16161e; border: 1px solid #222230; border-radius: 12px; overflow: hidden;
      text-decoration: none; color: #fff; transition: transform 0.2s, border-color 0.2s;
    }
    .game-card:hover { border-color: #ff007f; transform: translateY(-2px); }
    .game-img { width: 100%; height: 110px; background: linear-gradient(45deg, #1f1f2e, #2a2a3d); display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .game-name { padding: 10px; font-size: 14px; font-weight: bold; text-align: center; }

    /* Aşağı Naviqasiya Paneli (2-ci şəkil formatı) */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #16161e;
      border-top: 1px solid #222230; display: flex; justify-content: space-around;
      padding: 8px 0; z-index: 1000;
    }
    .nav-item {
      background: none; border: none; color: #888; display: flex; flex-direction: column;
      align-items: center; font-size: 11px; text-decoration: none; gap: 4px; cursor: pointer; transition: color 0.2s;
    }
    .nav-item.active { color: #2979ff; }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
  </style>
</head>
<body>

    </div>
  </header>

  <!-- Animasiyalı Reklam Panosu -->

  <!-- Canlı Uduşlar Lentəsi -->

  <!-- Aşağı Naviqasiya Paneli -->

      Menyu
    </button>
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

    </a>
    <a href="slot1.html" class="nav-item">

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userId = localStorage.getItem('diva_user_id');
    if (!userId) {
      userId = 'USER_' + Math.floor(100000 + Math.random() * 900000);
      localStorage.setItem('diva_user_id', userId);
    }

    // Balansı real-time oxumaq
    db.collection('users').doc(userId).onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        if (data.isBanned) {
          document.body.innerHTML = "<h1 style='color:#ff007f; text-align:center; margin-top:100px;'>HESABINIZ BLOKLANIB!</h1>";
          return;
        }
        document.getElementById('header-balance').innerText = Number(data.balance || 0).toFixed(2).replace('.', ',');
      } else {
        db.collection('users').doc(userId).set({
          balance: 0,
          winRate: 50,
          isBanned: false,
          createdAt: new Date()
        });
      }
    });

    // Reklam panosu üçün animasiyalı sözlərin dəyişməsi
    const promos = [
      "🔥 MEGA FRUIT: 20X-ə QƏDƏR UDUŞ ŞANSI! 🔥",
      "💎 ALMAZ VƏ YEDDİLİK İLƏ QAZANCINI QATLA! 💎",
      "⚡ ƏN YÜKSƏK ƏMSALLAR YALNIZ BİZDƏ! ⚡"
    ];
    let promoIdx = 0;
    setInterval(() => {
      promoIdx = (promoIdx + 1) % promos.length;
      document.getElementById('promo-text').innerText = promos[promoIdx];
    }, 3500);

    // Canlı uduşlar lentəsini simulyasiya edən funksiya (baza istifadəçilərindən rast gələnləri göstərir)
    setInterval(() => {
      const randomId = 'USER_' + Math.floor(100000 + Math.random() * 900000);
      const randomWin = (Math.random() * 20 + 0.5).toFixed(2);
      document.getElementById('live-user').innerText = randomId;
      document.getElementById('live-amount').innerText = `+${randomWin} AZN`;
    }, 4000);
  </script>
