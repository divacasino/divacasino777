<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diva Casino - Ana Səhifə</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0b0b10; color: #fff; overflow-x: hidden; padding-bottom: 70px; }

    /* --- GİRİŞ ANİMASİYASI (SPLASH SCREEN) --- */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0b10; z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    .splash-logo {
      font-size: 45px; font-weight: 900; color: #ff007f;
      text-transform: uppercase; letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
      animation: pulseLogo 1.5s infinite alternate;
    }
    .splash-text { margin-top: 10px; color: #69f0ae; font-size: 14px; letter-spacing: 2px; }
    
    @keyframes pulseLogo {
      0% { transform: scale(1); text-shadow: 0 0 10px rgba(255, 0, 127, 0.4); }
      100% { transform: scale(1.15); text-shadow: 0 0 30px rgba(255, 0, 127, 0.9); }
    }

    /* --- YUXARI PANEL (HEADER) --- */
    header {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(22, 22, 30, 0.85); backdrop-filter: blur(10px);
      padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255, 0, 127, 0.2);
    }
    .brand { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #ff007f, #ff4500); -webkit-background-clip: text; color: transparent; }
    
    .user-info-box { text-align: right; }
    .user-id { font-size: 11px; color: #8888a0; font-weight: 800; letter-spacing: 1px; }
    .user-balance { font-size: 18px; font-weight: 900; color: #00e676; text-shadow: 0 0 10px rgba(0, 230, 118, 0.3); }

    /* --- ƏSAS KONTENT --- */
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }

    .promo-banner {
      background: linear-gradient(135deg, #2a0845, #6441A5);
      border-radius: 16px; padding: 20px; margin-bottom: 25px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5); border: 1px solid #ff007f;
    }
    .promo-text h2 { font-size: 20px; margin-bottom: 5px; color: #fff; }
    .promo-text p { font-size: 12px; color: #ccc; }
    .promo-btn { background: #ff007f; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,0,127,0.4); }

    .section-title { font-size: 16px; font-weight: bold; color: #aaa; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }

    /* --- OYUNLAR ŞƏBƏKƏSİ --- */
    .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    
    .game-card {
      background: #16161e; border-radius: 14px; overflow: hidden;
      border: 1px solid #222230; transition: transform 0.2s, border-color 0.2s;
      cursor: pointer; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .game-card:active { transform: scale(0.95); }
    .game-card:hover { border-color: #ff007f; }
    
    .game-img { width: 100%; height: 120px; object-fit: cover; border-bottom: 2px solid #ff007f; }
    .game-info { padding: 12px; text-align: center; }
    .game-title { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .game-provider { font-size: 11px; color: #888; }
    .hot-badge { position: absolute; top: 8px; right: 8px; background: #ff3d00; color: #fff; font-size: 10px; font-weight: bold; padding: 3px 6px; border-radius: 4px; box-shadow: 0 0 10px rgba(255,61,0,0.6); }

    /* --- PROFİL SƏHİFƏSİ --- */
    #profile-section { display: none; }
    .profile-menu { background: #16161e; border-radius: 16px; padding: 10px; border: 1px solid #222230; }
    .profile-btn {
      width: 100%; background: transparent; color: #fff; border: none; 
      padding: 15px; text-align: left; font-size: 16px; font-weight: bold;
      border-bottom: 1px solid #222230; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: 0.2s;
    }
    .profile-btn:last-child { border-bottom: none; }
    .profile-btn:active { background: #222230; }
    .btn-deposit { color: #00e676; }
    .btn-withdraw { color: #ff007f; }
    .btn-logout { color: #ff3d00; }

    /* --- ALT MENYU (BOTTOM NAV) --- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(22, 22, 30, 0.9); backdrop-filter: blur(10px);
      border-top: 1px solid #222230; display: flex; padding: 10px 0;
      padding-bottom: env(safe-area-inset-bottom, 10px);
    }
    .nav-item {
      flex: 1; text-align: center; color: #888; font-size: 12px; font-weight: bold;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .nav-item.active { color: #ff007f; }
    .nav-icon { font-size: 20px; }
  </style>
</head>
<body>

  <!-- 1. GİRİŞ ANİMASİYASI -->
  <div id="splash-screen">
    <div class="splash-logo">DIVA</div>
    <div class="splash-text">Yüklənir...</div>
  </div>

  <!-- 2. YUXARI PANEL -->
  <header>
    <div class="brand">DIVA</div>
    <div class="user-info-box">
      <div class="user-id">ID: <span id="display-id">----</span></div>
      <div class="user-balance" id="display-balance">0.00 AZN</div>
    </div>
  </header>

  <div class="container">
    
    <!-- 3. OYUNLAR BÖLMƏSİ (ƏSAS) -->
    <div id="games-section">
      <div class="promo-banner">
        <div class="promo-text">
          <h2>Xoş Gəldin!</h2>
          <p>Şansını yoxla və böyük qazan.</p>
        </div>
        <button class="promo-btn">Oyna</button>
      </div>

      <div class="section-title">Populyar Oyunlar</div>
      
      <div class="games-grid">
        <!-- SLOT OYUNU BURADADIR -->
        <div class="game-card" onclick="window.location.href='slot.html'">
          <div class="hot-badge">HOT</div>
          <!-- Github-a yüklədiyiniz Slot1.JPG şəkli -->
          <img src="Slot1.JPG" alt="Slot" class="game-img" onerror="this.src='https://via.placeholder.com/150x120/1a1a2e/ff007f?text=Slot+Oyna'">
          <div class="game-info">
            <div class="game-title">Cash'in Fruits 100</div>
            <div class="game-provider">Diva Originals</div>
          </div>
        </div>

        <!-- Yaxında gələcək oyun -->
        <div class="game-card" style="opacity: 0.6;">
          <img src="https://via.placeholder.com/150x120/16161e/444?text=Tezlikle" alt="Tezlikle" class="game-img">
          <div class="game-info">
            <div class="game-title">Joker's Wealth</div>
            <div class="game-provider">Yaxında...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. PROFİL BÖLMƏSİ (Yalnız ayarlar, ID və Balans yoxdur) -->
    <div id="profile-section">
      <div class="section-title">Hesab İdarəetməsi</div>
      <div class="profile-menu">
        <button class="profile-btn btn-deposit">Depozit Et <span>+</span></button>
        <button class="profile-btn btn-withdraw">Çıxarış Et <span>-</span></button>
        <button class="profile-btn">Mərc Tarixçəsi <span>></span></button>
        <button class="profile-btn">Səs və Ayarlar <span>></span></button>
        <button class="profile-btn btn-logout" onclick="logout()">Hesabdan Çıx <span>🚪</span></button>
      </div>
    </div>

  </div>

  <!-- 5. ALT MENYU -->
  <div class="bottom-nav">
    <div class="nav-item active" id="nav-games" onclick="switchTab('games')">
      <div class="nav-icon">🎰</div>
      Oyunlar
    </div>
    <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
      <div class="nav-icon">👤</div>
      Profil
    </div>
  </div>

  <script>
    // --- SPLASH SCREEN LOGIC ---
    window.onload = function() {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.visibility = 'hidden';
        }, 800);
      }, 2000); // 2 saniyə sonra açılır
    };

    // --- TAB DEYİŞDİRMƏ LOGIC ---
    function switchTab(tab) {
      document.getElementById('nav-games').classList.remove('active');
      document.getElementById('nav-profile').classList.remove('active');
      
      document.getElementById('games-section').style.display = 'none';
      document.getElementById('profile-section').style.display = 'none';

      document.getElementById('nav-' + tab).classList.add('active');
      document.getElementById(tab + '-section').style.display = 'block';
    }

    // --- FİREBASE LOGIC ---
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    let userId = localStorage.getItem('diva_user_id');
    if (!userId) {
      userId = Math.floor(100000 + Math.random() * 900000).toString();
      localStorage.setItem('diva_user_id', userId);
    }

    document.getElementById('display-id').innerText = userId;

    // Balansı canlı yenilə
    db.collection("users").doc(userId).onSnapshot((doc) => {
      if (doc.exists) {
        let data = doc.data();
        if (data.isBanned) {
          alert("Hesabınız bloklanıb.");
          document.body.innerHTML = "<h1 style='text-align:center; margin-top:50px; color:red;'>HESAB BLOKLANIB</h1>";
          return;
        }
        document.getElementById('display-balance').innerText = (data.balance || 0).toFixed(2) + " AZN";
        
        // Aktivliyi bildir
        db.collection("users").doc(userId).update({
          lastActive: Date.now(),
          currentGame: "Ana Səhifə"
        });
      } else {
        // Yeni istifadəçi
        db.collection("users").doc(userId).set({
          balance: 0,
          winRate: 20,
          isBanned: false,
          lastActive: Date.now(),
          currentGame: "Ana Səhifə"
        });
      }
    });

    function logout() {
      localStorage.removeItem('diva_user_id');
      window.location.reload();
    }
  </script>
</body>
</html>
