<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diva Casino</title>
  
  <link rel="icon" type="image/png" href="logo.png.PNG">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background-color: #0b0b10; color: #ffffff; padding-bottom: 75px; overflow-x: hidden; }

    /* Açılış Loaderi - Təhlükəsizlik düzəlişi ilə */
    #page-loader { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: #0b0b10; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      transition: opacity 0.4s ease; 
    }
    #page-loader.fade-out { opacity: 0; pointer-events: none; visibility: hidden; }
    .loader-logo { width: 150px; max-width: 60%; height: auto; animation: pulseLogo 1.2s infinite ease-in-out; }
    @keyframes pulseLogo { 0%, 100% { transform: scale(0.95); opacity: 0.85; } 50% { transform: scale(1.05); opacity: 1; } }

    /* Header */
    header { background: #16161e; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222230; position: sticky; top: 0; z-index: 1000; height: 55px; }
    .logo-img { height: 32px; max-width: 120px; object-fit: contain; }
    .user-panel { display: flex; align-items: center; gap: 10px; }
    .balance-box { text-align: right; }
    .user-id-txt { font-size: 10px; color: #8888a0; font-weight: 700; }
    .user-bal-txt { font-size: 14px; font-weight: 900; color: #00e676; }
    .deposit-btn { background: #00c853; color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; }
    
    .container { padding: 12px; max-width: 600px; margin: 0 auto; }

    /* Ana Səhifə Komponentləri */
    .promo-banner { background: linear-gradient(90deg, #d500f9, #7c4dff); border-radius: 8px; padding: 7px 10px; text-align: center; font-weight: 800; font-size: 11px; text-transform: uppercase; color: #fff; margin-bottom: 10px; }
    .live-wins { background: #16161e; border: 1px solid #222230; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 11px; font-weight: bold; }
    .live-tag { color: #ff3d00; display: flex; align-items: center; gap: 5px; font-size: 10px; }
    .live-dot { width: 7px; height: 7px; background: #ff3d00; border-radius: 50%; animation: blink 1s infinite alternate; }
    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
    .live-amount { color: #00e676; font-weight: 900; }

    .section-title { font-size: 12px; font-weight: 900; color: #8888a0; text-transform: uppercase; margin-bottom: 10px; }
    .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .game-card { background: #16161e; border: 1px solid #222230; border-radius: 10px; overflow: hidden; position: relative; text-decoration: none; color: #fff; display: flex; flex-direction: column; }
    .game-thumb-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; background: #1a1a24; display: flex; align-items: center; justify-content: center; }
    .game-thumb { width: 100%; height: 100%; object-fit: cover; }
    .game-title { padding: 6px 4px; font-size: 10px; font-weight: 800; text-align: center; background: #16161e; }
    .coming-soon-bg { background: #1f1f2b; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .badge-coming { position: absolute; top: 4px; right: 4px; background: rgba(255,0,127,0.85); font-size: 8px; font-weight: 900; padding: 2px 4px; border-radius: 4px; }

    /* Profil Səhifəsi Komponentləri */
    .profile-card { background: #16161e; border: 1px solid #222230; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 15px; }
    .profile-avatar { width: 60px; height: 60px; background: #2f2f42; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 10px auto; }
    .profile-id { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 5px; }
    .profile-bal { font-size: 24px; font-weight: 900; color: #00e676; margin-bottom: 15px; }
    
    .profile-actions { display: flex; gap: 10px; }
    .btn-action { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 900; font-size: 13px; cursor: pointer; color: #fff; }
    .btn-dep { background: #00c853; }
    .btn-wit { background: #2f2f42; }

    .menu-list { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    .menu-item { background: #16161e; border: 1px solid #222230; padding: 14px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; color: #fff; text-decoration: none; cursor: pointer; }
    .logout-btn { margin-top: 15px; background: #ff3d00; color: #fff; padding: 14px; border-radius: 10px; text-align: center; font-weight: 900; font-size: 13px; cursor: pointer; border: none; width: 100%; }

    /* Naviqasiya */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #16161e; border-top: 1px solid #222230; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    .nav-item { background: none; border: none; color: #8888a0; display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 3px; cursor: pointer; width: 33%; font-weight: 700; }
    .nav-item.active { color: #ff007f; }
    .nav-item svg { width: 20px; height: 20px; fill: currentColor; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="page-loader">
    <img src="logo.png.PNG" alt="Diva Casino" class="loader-logo" onerror="this.style.display='none';">
  </div>

  <header>
    <img src="logo.png.PNG" alt="Diva" class="logo-img" onerror="this.style.display='none';">
    <div class="user-panel">
      <div class="balance-box">
        <div class="user-id-txt">ID: <span id="display-user-id">----</span></div>
        <div class="user-bal-txt" id="display-user-balance">0.00 AZN</div>
      </div>
      <button class="deposit-btn" onclick="alert('Depozit tezliklə aktiv olacaq!')">Depozit</button>
    </div>
  </header>

  <div class="container">
    
    <div id="view-home">
      <div class="promo-banner" id="main-banner">💎 7 SİMVOLLARI İLƏ QAZANCINI ARTIR! 💎</div>

      <div class="live-wins" id="live-wins-box">
        <div class="live-tag"><span class="live-dot"></span> CANLI UDUŞ</div>
        <div style="color: #aaa;" id="live-username">ID: 8**1</div>
        <div class="live-amount" id="live-win-amount">+4.36 AZN</div>
      </div>

      <div class="section-title" id="games-section-title">POPULYAR SLOTLAR</div>
      
      <div class="games-grid">
        <a href="slot1.html" class="game-card">
          <div class="game-thumb-wrapper">
            <img src="slot1.JPG" alt="Cash'in Fruits" class="game-thumb" onerror="this.src='logo.png.PNG';">
          </div>
          <div class="game-title">Cash'in Fruits 100</div>
        </a>
        <div class="game-card" onclick="alert('Tezliklə!')">
          <div class="game-thumb-wrapper">
            <div class="coming-soon-bg">🎲</div><span class="badge-coming">Tezliklə</span>
          </div>
          <div class="game-title">Rulet</div>
        </div>
        <div class="game-card" onclick="alert('Tezliklə!')">
          <div class="game-thumb-wrapper">
            <div class="coming-soon-bg">🃏</div><span class="badge-coming">Tezliklə</span>
          </div>
          <div class="game-title">Poker</div>
        </div>
      </div>
    </div>

    <div id="view-profile" class="hidden">
      <div class="profile-card">
        <div class="profile-avatar">👤</div>
        <div class="profile-id">İstifadəçi ID: <span id="profile-user-id">----</span></div>
        <div class="profile-bal" id="profile-user-balance">0.00 AZN</div>
        
        <div class="profile-actions">
          <button class="btn-action btn-dep" onclick="alert('Depozit tezliklə aktiv olacaq!')">Depozit et</button>
          <button class="btn-action btn-wit" onclick="alert('Çıxarış üçün minimum limit 10 AZN-dir.')">Çıxarış et</button>
        </div>
      </div>

      <div class="menu-list">
        <div class="menu-item" onclick="alert('Tarixçə boşdur.')">Oyun Tarixçəsi <span>➔</span></div>
        <div class="menu-item" onclick="alert('Bonusunuz yoxdur.')">Aktiv Bonuslar <span>➔</span></div>
        <div class="menu-item" onclick="alert('Canlı dəstək tezliklə əlavə ediləcək.')">Müştəri Xidmətləri <span>➔</span></div>
      </div>

      <button class="logout-btn" onclick="alert('Hesabdan çıxış edildi!'); location.reload();">Hesabdan Çıx</button>
    </div>

  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Əsas səhifə
    </button>
    <button class="nav-item" id="nav-casino" onclick="switchTab('casino')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      Kazino
    </button>
    <button class="nav-item" id="nav-profile" onclick="switchTab('profile')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Hesabım
    </button>
  </nav>

  <script>
    // Qara Ekranı Bağlamaq üçün Təhlükəsiz Funksiya
    function closeLoader() {
      const loader = document.getElementById('page-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => { loader.style.display = 'none'; }, 400);
      }
    }

    // Maksimum 800ms gözləyir və qara ekranı bağlayır
    setTimeout(closeLoader, 800);
    window.addEventListener('load', closeLoader);

    // Firebase Konfiqurasiyası
    try {
      const firebaseConfig = {
        apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
        authDomain: "diva-casino.firebaseapp.com",
        projectId: "diva-casino",
        storageBucket: "diva-casino.firebasestorage.app",
        messagingSenderId: "406269257311",
        appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      let userId = localStorage.getItem('diva_user_id');
      if (!userId || userId.startsWith('USER_')) {
        userId = Math.floor(1000 + Math.random() * 9000).toString();
        localStorage.setItem('diva_user_id', userId);
      }
      
      document.getElementById('display-user-id').innerText = userId;
      document.getElementById('profile-user-id').innerText = userId;

      db.collection('users').doc(userId).onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          if (data.isBanned) {
            document.body.innerHTML = "<div style='color:#ff007f;text-align:center;padding-top:150px;font-size:22px;font-weight:900;'>HESABINIZ BLOKLANIB!</div>";
            return;
          }
          const bal = (parseFloat(data.balance) || 0).toFixed(2) + " AZN";
          document.getElementById('display-user-balance').innerText = bal;
          document.getElementById('profile-user-balance').innerText = bal;
        }
      });
    } catch(e) {
      console.log("Firebase error:", e);
    }

    // Canlı Uduş
    setInterval(() => {
      const firstD = Math.floor(Math.random() * 9) + 1;
      const lastD = Math.floor(Math.random() * 10);
      const amount = (Math.random() * 15 + 1).toFixed(2);
      document.getElementById('live-username').innerText = `ID: ${firstD}**${lastD}`;
      document.getElementById('live-win-amount').innerText = `+${amount} AZN`;
    }, 4000);

    // Keçid Məntiqi
    function switchTab(tab) {
      const viewHome = document.getElementById('view-home');
      const viewProfile = document.getElementById('view-profile');
      const btnHome = document.getElementById('nav-home');
      const btnCasino = document.getElementById('nav-casino');
      const btnProfile = document.getElementById('nav-profile');
      
      const banner = document.getElementById('main-banner');
      const liveBox = document.getElementById('live-wins-box');
      const title = document.getElementById('games-section-title');

      btnHome.classList.remove('active');
      btnCasino.classList.remove('active');
      btnProfile.classList.remove('active');

      if (tab === 'home') {
        btnHome.classList.add('active');
        viewProfile.classList.add('hidden');
        viewHome.classList.remove('hidden');
        banner.classList.remove('hidden');
        liveBox.classList.remove('hidden');
        title.innerText = "POPULYAR SLOTLAR";
      } 
      else if (tab === 'casino') {
        btnCasino.classList.add('active');
        viewProfile.classList.add('hidden');
        viewHome.classList.remove('hidden');
        banner.classList.add('hidden');
        liveBox.classList.add('hidden');
        title.innerText = "KAZİNO OYUNLARI";
      } 
      else if (tab === 'profile') {
        btnProfile.classList.add('active');
        viewHome.classList.add('hidden');
        viewProfile.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
