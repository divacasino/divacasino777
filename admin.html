<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diva Casino - Təhlükəsiz Admin Panel</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0b10; color: #fff; }
    
    /* Login Ekranı */
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b10; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    .login-box { background: #16161e; padding: 30px; border-radius: 12px; border: 1px solid #ff007f; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 0 20px rgba(255, 0, 127, 0.2); }
    .login-box h2 { color: #ff007f; margin-bottom: 20px; text-transform: uppercase; }
    .login-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0b0b10; color: #fff; margin-bottom: 15px; font-size: 16px; text-align: center; outline: none; }
    .login-box button { width: 100%; background: #ff007f; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }

    /* Əsas Struktur */
    .header { background: #16161e; padding: 15px; text-align: center; border-bottom: 1px solid #222230; position: relative; }
    .header h1 { font-size: 18px; color: #ff007f; text-transform: uppercase; }
    .back-btn { position: absolute; left: 15px; top: 15px; background: #222230; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; display: none; }

    .container { padding: 20px; max-width: 600px; margin: 0 auto; }

    /* Dashboard Paneli */
    .stats-panel { display: flex; gap: 15px; margin-bottom: 30px; }
    .stat-card { flex: 1; background: #16161e; border: 1px solid #222230; border-radius: 12px; padding: 20px; text-align: center; }
    .stat-title { font-size: 12px; color: #aaa; font-weight: bold; text-transform: uppercase; }
    .stat-value { font-size: 32px; font-weight: 900; color: #00e676; margin-top: 10px; }

    .big-square-btn {
      width: 100%; aspect-ratio: 2/1; background: linear-gradient(135deg, #1f1f2e, #16161e);
      border: 2px solid #ff007f; border-radius: 16px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; color: #fff; transition: 0.2s;
    }
    .big-square-btn:hover { background: #ff007f; color: #fff; }
    .big-square-btn span { font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

    /* Axtarış Qutusu */
    .search-box { width: 100%; padding: 12px; background: #16161e; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 15px; margin-bottom: 15px; outline: none; }
    .search-box:focus { border-color: #ff007f; }

    /* Oyunçular Siyahısı Ekranı */
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; background: #16161e; border: 1px solid #333; color: #aaa; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #ff007f; color: #fff; border-color: #ff007f; }

    .player-list { display: flex; flex-direction: column; gap: 10px; }
    .player-row { background: #16161e; border: 1px solid #222230; padding: 15px; border-radius: 10px; display: flex; align-items: center; cursor: pointer; justify-content: space-between; }
    .player-row:hover { border-color: #ff007f; }
    .player-info { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: bold; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-online { background: #00e676; box-shadow: 0 0 8px #00e676; }
    .dot-offline { background: #ff3d00; box-shadow: 0 0 8px #ff3d00; }

    /* Oyunçu Detal Ekranı */
    .detail-card { background: #16161e; border: 1px solid #222230; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
    .detail-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
    .detail-id { font-size: 20px; font-weight: 900; color: #fff; }
    
    .current-game { background: #1f1f2e; padding: 10px; border-radius: 8px; text-align: center; color: #00e676; font-weight: bold; margin-bottom: 20px; font-size: 14px; }

    .control-group { margin-bottom: 20px; }
    .control-label { font-size: 12px; color: #aaa; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: block; }
    
    .input-row { display: flex; gap: 10px; align-items: center; }
    .input-row button { background: #333; color: #fff; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer; font-weight: bold; }
    .input-row button:hover { background: #555; }
    .input-row input { flex: 1; height: 40px; background: #0b0b10; border: 1px solid #444; color: #fff; text-align: center; font-size: 16px; font-weight: bold; border-radius: 8px; }

    .reset-btn { width: 100%; background: transparent; border: 1px solid #ff3d00; color: #ff3d00; padding: 10px; border-radius: 8px; margin-top: 10px; cursor: pointer; font-weight: bold; }
    .ban-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; text-transform: uppercase; }
    .btn-block { background: #ff3d00; color: #fff; }
    .btn-unblock { background: #00e676; color: #fff; }
    
    .save-btn { width: 100%; background: #00e676; color: #111; padding: 15px; border-radius: 8px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Təhlükəsizlik Login Ekranı -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Sistemə Giriş</h2>
      <input type="password" id="admin-pwd" placeholder="Şifrəni daxil edin">
      <button onclick="checkLogin()">Daxil Ol</button>
      <p id="login-err" style="color: red; margin-top: 10px; display: none; font-size: 12px;">Şifrə yanlışdır!</p>
    </div>
  </div>

  <div class="header">
    <button class="back-btn" id="back-btn" onclick="goBack()">Geri</button>
    <h1>Diva İdarəetmə</h1>
  </div>

  <div class="container">
    
    <!-- Dashboard Ekranı -->
    <div id="dashboard-view">
      <div class="stats-panel">
        <div class="stat-card">
          <div class="stat-title">Ümumi</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Aktiv (Onlayn)</div>
          <div class="stat-value" id="stat-active" style="color: #ff007f;">0</div>
        </div>
      </div>
      
      <div class="big-square-btn" onclick="showView('list-view')">
        <span>Oyunçular</span>
      </div>
    </div>

    <!-- Oyunçular Siyahısı Ekranı -->
    <div id="list-view" class="hidden">
      <!-- Axtarış Qutusu -->
      <input type="text" id="search-input" class="search-box" placeholder="Oyunçu ID-si ilə axtar..." oninput="renderList()">

      <div class="tabs">
        <div class="tab-btn active" id="tab-all" onclick="filterList('all')">Hamısı</div>
        <div class="tab-btn" id="tab-active" onclick="filterList('active')">Aktiv Olanlar</div>
      </div>
      
      <div class="player-list" id="players-container">
        <!-- Siyahı JS ilə yüklənəcək -->
      </div>
    </div>

    <!-- Oyunçu Parametrləri (Detal) Ekranı -->
    <div id="detail-view" class="hidden">
      <div class="detail-card">
        <div class="detail-header">
          <div class="detail-id" id="det-id">ID: ----</div>
          <div id="det-status" class="dot dot-offline"></div>
        </div>
        
        <div class="current-game" id="det-game">Hal-hazırda: Ana Səhifə</div>

        <div class="control-group">
          <label class="control-label">Balans Tənzimləməsi (AZN)</label>
          <div class="input-row">
            <button onclick="adjustVal('det-bal', -1)">-</button>
            <input type="number" id="det-bal" step="0.1">
            <button onclick="adjustVal('det-bal', 1)">+</button>
          </div>
          <button class="reset-btn" onclick="resetBalance()">Balansı Sıfırla (0 AZN)</button>
        </div>

        <div class="control-group">
          <label class="control-label">Uduş Şansı (%)</label>
          <div class="input-row">
            <button onclick="adjustVal('det-win', -5)">-</button>
            <input type="number" id="det-win" min="0" max="100">
            <button onclick="adjustVal('det-win', 5)">+</button>
          </div>
        </div>

        <div class="control-group">
          <button id="det-ban-btn" class="ban-btn btn-block" onclick="toggleBan()">Blokla</button>
        </div>

        <button class="save-btn" onclick="saveUserData()">Məlumatları Yadda Saxla</button>
      </div>
    </div>

  </div>

  <script>
    function checkLogin() {
      const pwd = document.getElementById("admin-pwd").value;
      if (pwd === "salam123") {
        document.getElementById("login-screen").style.display = "none";
      } else {
        document.getElementById("login-err").style.display = "block";
      }
    }

    // FİREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allUsers = [];
    let currentFilter = 'all';
    let selectedUserId = null;
    let selectedUserDoc = null;
    let currentView = 'dashboard-view';

    // Real-time məlumat axını
    db.collection("users").onSnapshot(snapshot => {
      allUsers = [];
      let activeCount = 0;
      const now = Date.now();

      snapshot.forEach(doc => {
        let user = doc.data();
        user.uid = doc.id;
        user.isOnline = user.lastActive && (now - user.lastActive < 60000);
        if (user.isOnline) activeCount++;
        allUsers.push(user);
      });

      document.getElementById("stat-total").innerText = allUsers.length;
      document.getElementById("stat-active").innerText = activeCount;

      if (currentView === 'list-view') renderList();
    });

    function showView(viewId) {
      document.getElementById("dashboard-view").classList.add("hidden");
      document.getElementById("list-view").classList.add("hidden");
      document.getElementById("detail-view").classList.add("hidden");
      
      document.getElementById(viewId).classList.remove("hidden");
      currentView = viewId;

      if (viewId === 'dashboard-view') {
        document.getElementById("back-btn").style.display = "none";
      } else {
        document.getElementById("back-btn").style.display = "block";
      }

      if (viewId === 'list-view') renderList();
    }

    function goBack() {
      if (currentView === 'detail-view') {
        showView('list-view');
      } else if (currentView === 'list-view') {
        showView('dashboard-view');
      }
    }

    function filterList(type) {
      currentFilter = type;
      document.getElementById('tab-all').classList.remove('active');
      document.getElementById('tab-active').classList.remove('active');
      document.getElementById('tab-' + type).classList.add('active');
      renderList();
    }

    // Oyunçuları Siyahıtlama və Axtarış Məntiqi
    function renderList() {
      const container = document.getElementById("players-container");
      const searchQuery = document.getElementById("search-input").value.trim().toLowerCase();
      container.innerHTML = "";

      let filteredUsers = allUsers;

      // Tab filteri
      if (currentFilter === 'active') {
        filteredUsers = filteredUsers.filter(u => u.isOnline);
      }

      // ID axtarış filteri
      if (searchQuery !== "") {
        filteredUsers = filteredUsers.filter(u => u.uid.toLowerCase().includes(searchQuery));
      }

      if (filteredUsers.length === 0) {
        container.innerHTML = "<div style='text-align:center; color:#777; padding:20px;'>Oyunçu tapılmadı</div>";
        return;
      }

      filteredUsers.forEach(user => {
        const div = document.createElement("div");
        div.className = "player-row";
        div.onclick = () => openUserDetail(user.uid);
        
        const dotClass = user.isOnline ? "dot-online" : "dot-offline";
        div.innerHTML = `
          <div class="player-info">
            <span class="dot ${dotClass}"></span> ID: ${user.uid}
          </div>
          <div style="font-size:12px; color:#aaa;">${Number(user.balance || 0).toFixed(2)} AZN</div>
        `;
        container.appendChild(div);
      });
    }

    function openUserDetail(uid) {
      selectedUserId = uid;
      selectedUserDoc = allUsers.find(u => u.uid === uid);
      
      document.getElementById("det-id").innerText = "ID: " + uid;
      document.getElementById("det-status").className = "dot " + (selectedUserDoc.isOnline ? "dot-online" : "dot-offline");
      document.getElementById("det-game").innerText = selectedUserDoc.currentGame ? "Hal-hazırda: " + selectedUserDoc.currentGame : "Hal-hazırda: Ana Səhifə";
      
      document.getElementById("det-bal").value = selectedUserDoc.balance || 0;
      document.getElementById("det-win").value = selectedUserDoc.winRate !== undefined ? selectedUserDoc.winRate : 50;
      
      const banBtn = document.getElementById("det-ban-btn");
      if (selectedUserDoc.isBanned) {
        banBtn.innerText = "Blokdan Çıxar";
        banBtn.className = "ban-btn btn-unblock";
      } else {
        banBtn.innerText = "Saytdan Blokla";
        banBtn.className = "ban-btn btn-block";
      }

      showView('detail-view');
    }

    function adjustVal(inputId, amount) {
      const input = document.getElementById(inputId);
      let val = parseFloat(input.value) || 0;
      val += amount;
      if (inputId === 'det-win' && val > 100) val = 100;
      if (inputId === 'det-win' && val < 0) val = 0;
      if (inputId === 'det-bal' && val < 0) val = 0;
      input.value = val.toFixed(inputId === 'det-bal' ? 2 : 0);
    }

    function resetBalance() { document.getElementById("det-bal").value = 0; }

    function toggleBan() {
      selectedUserDoc.isBanned = !selectedUserDoc.isBanned;
      const banBtn = document.getElementById("det-ban-btn");
      if (selectedUserDoc.isBanned) {
        banBtn.innerText = "Blokdan Çıxar";
        banBtn.className = "ban-btn btn-unblock";
      } else {
        banBtn.innerText = "Saytdan Blokla";
        banBtn.className = "ban-btn btn-block";
      }
    }

    function saveUserData() {
      const newBal = parseFloat(document.getElementById("det-bal").value) || 0;
      const newWin = parseFloat(document.getElementById("det-win").value) || 50;

      db.collection("users").doc(selectedUserId).update({
        balance: newBal,
        winRate: newWin,
        isBanned: selectedUserDoc.isBanned || false
      }).then(() => {
        alert("Məlumatlar uğurla yeniləndi!");
        goBack();
      }).catch(err => {
        alert("Xəta baş verdi: " + err);
      });
    }

    setInterval(() => { if(currentView === 'list-view') renderList(); }, 10000);
  </script>
</body>
</html>
