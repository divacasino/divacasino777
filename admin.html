<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diva Casino - Admin Panel</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0b10; color: #fff; padding: 20px 15px; }
    
    /* Login Ekranı */
    #login-box {
      max-width: 350px; margin: 80px auto; background: #16161e; padding: 25px;
      border-radius: 16px; border: 1px solid #ff007f; text-align: center;
    }
    .pin-input {
      width: 100%; padding: 12px; margin: 15px 0; background: #0b0b10; border: 1px solid #333;
      color: #fff; border-radius: 8px; text-align: center; font-size: 18px; outline: none;
    }
    .login-btn {
      width: 100%; background: #ff007f; color: #fff; border: none; padding: 12px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;
    }

    /* Admin Paneli Panel */
    #admin-dashboard { display: none; }
    
    header {
      background: #16161e; padding: 15px; border-radius: 12px;
      border: 1px solid #ff007f; text-align: center; margin-bottom: 20px;
    }
    .logo { font-size: 20px; font-weight: bold; color: #ff007f; }

    .main-btn {
      width: 100%; background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #fff; border: none; padding: 15px; border-radius: 12px;
      font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
    }

    .user-card {
      background: #16161e; border-radius: 12px; padding: 15px;
      border: 1px solid #222230; margin-bottom: 12px;
    }
    .user-id { font-size: 13px; color: #888; font-weight: bold; margin-bottom: 8px; }
    .user-balance { font-size: 18px; font-weight: bold; color: #00e676; margin-bottom: 12px; }

    .action-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .bal-input {
      background: #0b0b10; border: 1px solid #33334d; color: #fff;
      padding: 10px; border-radius: 8px; width: 60%; font-size: 14px; outline: none;
    }

    .save-btn {
      background: #00e676; color: #000; border: none; padding: 10px; border-radius: 8px;
      width: 40%; font-weight: bold; cursor: pointer; font-size: 13px;
    }

    .ban-btn {
      width: 100%; background: #ff0055; color: #fff; border: none; padding: 8px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;
    }
    .unban-btn {
      width: 100%; background: #2979ff; color: #fff; border: none; padding: 8px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;
    }

    .banned-status { color: #ff0055; font-weight: bold; font-size: 12px; margin-bottom: 8px; }
    .active-status { color: #00e676; font-weight: bold; font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <!-- Şifrə Ekranı -->
  <div id="login-box">
    <h3 style="color:#ff007f;">Admin Girişi</h3>
    <input type="password" id="pin-code" class="pin-input" placeholder="Giriş Kodu">
    <button class="login-btn" onclick="checkPin()">Daxil Ol</button>
  </div>

  <!-- Esas Dashboard -->
  <div id="admin-dashboard">
    <header>
      <div class="logo">İDARƏETMƏ PANELSİ</div>
    </header>

    <button class="main-btn" onclick="toggleUsers()">👥 Oyunçular Siyahısı</button>

    <div id="users-list" style="display: none;"></div>
  </div>

  <script>
    const ADMIN_PIN = "1234"; // Şifrə buradadır

    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea",
      measurementId: "G-867WKS9NH7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function checkPin() {
      const pin = document.getElementById('pin-code').value;
      if (pin === ADMIN_PIN) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'block';
      } else {
        alert("Yanlış şifrə!");
      }
    }

    function toggleUsers() {
      const list = document.getElementById('users-list');
      if (list.style.display === 'none') {
        list.style.display = 'block';
        loadUsers();
      } else {
        list.style.display = 'none';
      }
    }

    function loadUsers() {
      db.collection('users').onSnapshot(snapshot => {
        const container = document.getElementById('users-list');
        container.innerHTML = '';

        if (snapshot.empty) {
          container.innerHTML = '<div style="text-align:center; color:#666;">İstifadəçi tapılmadı.</div>';
          return;
        }

        snapshot.forEach(doc => {
          const userId = doc.id;
          const data = doc.data();
          const balance = Number(data.balance || 0).toFixed(2);
          const isBanned = data.isBanned || false;

          const card = document.createElement('div');
          card.className = 'user-card';
          card.innerHTML = `
            <div class="user-id">👤 ID: ${userId}</div>
            <div class="${isBanned ? 'banned-status' : 'active-status'}">
              Status: ${isBanned ? 'BLOKLANIB (BAN)' : 'Aktiv'}
            </div>
            <div class="user-balance">Balans: ${balance} AZN</div>
            
            <div class="action-row">
              <input type="number" step="0.1" id="input-${userId}" class="bal-input" placeholder="Yeni AZN">
              <button class="save-btn" onclick="updateBalance('${userId}')">Yenilə</button>
            </div>

            <button class="${isBanned ? 'unban-btn' : 'ban-btn'}" onclick="toggleBan('${userId}', ${isBanned})">
              ${isBanned ? 'Banı Qaldır' : 'İstifadəçini Ban Et'}
            </button>
          `;
          container.appendChild(card);
        });
      });
    }

    function updateBalance(userId) {
      const inputEl = document.getElementById(`input-${userId}`);
      const newBal = parseFloat(inputEl.value);

      if (isNaN(newBal)) {
        alert("Düzgün məbləğ yazın!");
        return;
      }

      db.collection('users').doc(userId).update({
        balance: newBal
      }).then(() => {
        alert("Balans yeniləndi!");
        inputEl.value = '';
      });
    }

    function toggleBan(userId, currentStatus) {
      db.collection('users').doc(userId).update({
        isBanned: !currentStatus
      }).then(() => {
        alert(`İstifadəçi ${!currentStatus ? 'Ban olundu' : 'Bandan çıxarıldı'}!`);
      });
    }
  </script>
</body>
</html>
