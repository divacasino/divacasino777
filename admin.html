<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Diva Admin Panel</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0b0b10; color: #fff; padding: 20px; }
    
    .stats-card { background: #16161e; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-around; border: 1px solid #222230; }
    .stat-box { text-align: center; }
    .stat-val { font-size: 24px; font-weight: bold; color: #00e676; }
    .stat-label { font-size: 12px; color: #888; text-transform: uppercase; }

    .control-panel { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; }
    .btn-players { background: #3f51b5; }
    .btn-maintenance { background: #ff3d00; }
    
    .section-title { font-size: 18px; border-bottom: 1px solid #ff007f; padding-bottom: 10px; margin-bottom: 15px; }
    
    .player-list { display: flex; flex-direction: column; gap: 10px; }
    .player-card { background: #16161e; padding: 15px; border-radius: 8px; border: 1px solid #222230; display: flex; flex-direction: column; gap: 10px; }
    .p-header { display: flex; justify-content: space-between; align-items: center; }
    .p-id { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: red; }
    .status-dot.active { background: #00e676; box-shadow: 0 0 8px #00e676; }
    .p-loc { font-size: 12px; color: #aaa; }
    
    .p-actions { display: flex; gap: 10px; align-items: center; }
    input { background: #0b0b10; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 5px; width: 80px; text-align: center; }
    .save-btn { background: #00e676; color: #000; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Diva Control Center</h2>
  
  <div class="stats-card">
    <div class="stat-box">
      <div class="stat-val" id="total-players">0</div>
      <div class="stat-label">Ümumi Oyunçu</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="active-players">0</div>
      <div class="stat-label">Aktiv (Son 1 Dəq)</div>
    </div>
  </div>

  <div class="control-panel">
    <button class="btn btn-players">Oyunçular</button>
    <button class="btn btn-maintenance" id="maintenance-btn" onclick="toggleMaintenance()">Təmir Rejimi: OFF</button>
  </div>

  <div class="section-title">Oyunçu Siyahısı</div>
  <div class="player-list" id="player-list">
    <!-- Players render here -->
  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA", projectId: "diva-casino" }; // Add full config here
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isMaintenance = false;
    db.collection("settings").doc("system").onSnapshot(doc => {
      if (doc.exists) {
        isMaintenance = doc.data().maintenanceMode;
        let btn = document.getElementById("maintenance-btn");
        btn.innerText = isMaintenance ? "Təmir Rejimi: ON" : "Təmir Rejimi: OFF";
        btn.style.background = isMaintenance ? "#4caf50" : "#ff3d00";
      }
    });

    function toggleMaintenance() {
      db.collection("settings").doc("system").set({ maintenanceMode: !isMaintenance }, { merge: true });
    }

    db.collection("users").onSnapshot(snapshot => {
      let total = snapshot.size;
      let active = 0;
      let now = Date.now();
      let html = '';

      snapshot.forEach(doc => {
        let d = doc.data();
        let isActive = (now - d.lastActive) < 60000; // Active within 1 minute
        if(isActive) active++;

        html += `
          <div class="player-card">
            <div class="p-header">
              <div class="p-id">
                <div class="status-dot ${isActive ? 'active' : ''}"></div>
                ID: ${doc.id}
              </div>
              <div class="p-loc">📍 ${d.currentGame || 'Bilinmir'}</div>
            </div>
            <div>Balans: <b>${(d.balance || 0).toFixed(2)} ₼</b></div>
            <div class="p-actions">
              <label>Şans (%):</label>
              <input type="number" id="chance-${doc.id}" value="${d.winRate !== undefined ? d.winRate : 20}">
              <label>Balans:</label>
              <input type="number" id="bal-${doc.id}" value="${(d.balance || 0).toFixed(2)}">
              <button class="save-btn" onclick="saveUser('${doc.id}')">Yadda Saxla</button>
            </div>
          </div>
        `;
      });

      document.getElementById('total-players').innerText = total;
      document.getElementById('active-players').innerText = active;
      document.getElementById('player-list').innerHTML = html;
    });

    function saveUser(id) {
      let chance = parseFloat(document.getElementById(`chance-${id}`).value);
      let bal = parseFloat(document.getElementById(`bal-${id}`).value);
      db.collection("users").doc(id).update({ winRate: chance, balance: bal });
    }
  </script>
</body>
</html>
