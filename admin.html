<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diva Casino - Admin Panel</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0b10; color: #fff; padding: 20px 15px; }
    
    /* Login Ekranı */
    #login-box {
      max-width: 350px; margin: 80px auto; background: #16161e; padding: 25px;
      border-radius: 16px; border: 1px solid #ff007f; text-align: center;
    }
    .pin-input {
      width: 100%; padding: 12px; margin: 15px 0; background: #0b0b10; border: 1px solid #333;
      color: #fff; border-radius: 8px; text-align: center; font-size: 18px; outline: none;
    }
    .btn { padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 15px; width: 100%; }
    .btn-pink { background: #ff007f; color: #fff; }
    .btn-green { background: #00e676; color: #000; }
    .btn-blue { background: #2979ff; color: #fff; }
    .btn-red { background: #ff0055; color: #fff; }
    .btn-gradient { background: linear-gradient(135deg, #ff007f, #7928ca); color: #fff; }

    /* Ana Panel Strukturu */
    #admin-panel { display: none; max-width: 500px; margin: 0 auto; }
    .header-box { background: #16161e; padding: 15px; border-radius: 12px; border: 1px solid #ff007f; text-align: center; margin-bottom: 20px; }
    .logo { font-size: 20px; font-weight: bold; color: #ff007f; }

    /* Panellərin Gizlədilməsi/Göstərilməsi */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Dashboard */
    .stat-card { background: #16161e; border: 1px solid #222230; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .stat-number { font-size: 36px; font-weight: bold; color: #00e676; margin: 10px 0; }

    /* Oyunçu Siyahısı və Axtarış */
    .search-box { width: 100%; padding: 12px; margin-bottom: 15px; background: #16161e; border: 1px solid #ff007f; color: #fff; border-radius: 8px; outline: none; font-size: 15px; }
    .user-list-item { background: #16161e; border: 1px solid #222230; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .user-list-item:hover { border-color: #ff007f; background: #222230; }
    .user-status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .dot-active { background: #00e676; box-shadow: 0 0 5px #00e676; }
    .dot-banned { background: #ff0055; box-shadow: 0 0 5px #ff0055; }

    /* Redaktə Səhifəsi */
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn { background: #222230; color: #fff; border: 1px solid #ff007f; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; }
    
    .edit-card { background: #16161e; border: 1px solid #222230; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
    .edit-title { font-size: 12px; color: #aaa; text-transform: uppercase; margin-bottom: 10px; }
    
    .input-group { display: flex; gap: 10px; align-items: center; }
    .edit-input { flex: 1; background: #0b0b10; border: 1px solid #33334d; color: #00e676; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; text-align: center; outline: none; }
    
    .rate-controls { display: flex; gap: 5px; flex: 1; }
    .rate-btn { background: #ff007f; color: #fff; border: none; width: 40px; height: 42px; border-radius: 8px; font-weight: bold; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. GİRİŞ PANeli -->
  <div id="login-box">
    <h3 style="color:#ff007f;">Admin Girişi</h3>
    <input type="password" id="pin-code" class="pin-input" placeholder="Giriş Kodu">
    <button class="btn btn-pink" onclick="checkPin()">Daxil Ol</button>
  </div>

  <!-- ANA PANEL -->
  <div id="admin-panel">
    <div class="header-box"><div class="logo">İDARƏETMƏ PANELSİ</div></div>

    <!-- 2. DASHBOARD (Statistika) -->
    <div id="view-dashboard" class="view-section active">
      <div class="stat-card">
        <div style="color: #aaa; font-weight: bold;">Hazırda Aktiv Oyunçular</div>
        <div class="stat-number" id="active-users-count">0</div>
        <div style="font-size: 12px; color: #666;">(Bloklanmamış istifadəçilər)</div>
      </div>
      <button class="btn btn-gradient" onclick="switchView('view-users')">👥 Oyunçular Siyahısına Keç</button>
    </div>

    <!-- 3. OYUNÇU SİYAHISI -->
    <div id="view-users" class="view-section">
      <div class="nav-bar">
        <button class="back-btn" onclick="switchView('view-dashboard')">← Geri</button>
        <div style="font-weight: bold;">Siyahı</div>
      </div>
      <input type="text" id="search-input" class="search-box" placeholder="İstifadəçi ID axtar... (məs: 123456)" onkeyup="renderUserList()">
      <div id="users-list-container"></div>
    </div>

    <!-- 4. OYUNÇU REDAKTƏ -->
    <div id="view-edit" class="view-section">
      <div class="nav-bar">
        <button class="back-btn" onclick="switchView('view-users')">← Siyahıya Qayıt</button>
        <div style="font-weight: bold; color: #ff007f;">Redaktə</div>
      </div>

      <div class="edit-card" style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold;" id="edit-user-id">USER_XXXXXX</div>
        <div id="edit-status-text" style="margin-top: 5px; font-size: 13px;"></div>
      </div>

      <div class="edit-card">
        <div class="edit-title">Balans (AZN)</div>
        <div class="input-group">
          <input type="number" id="edit-balance" class="edit-input" step="0.10">
          <button class="btn btn-green" style="width: auto;" onclick="saveBalance()">Yadda Saxla</button>
        </div>
      </div>

      <div class="edit-card">
        <div class="edit-title">Uduş Şansı (%)</div>
        <div class="input-group">
          <div class="rate-controls">
            <button class="rate-btn" onclick="adjustRate(-10)">-</button>
            <input type="number" id="edit-rate" class="edit-input" min="0" max="100">
            <button class="rate-btn" onclick="adjustRate(10)">+</button>
          </div>
          <button class="btn btn-green" style="width: auto;" onclick="saveRate()">Yadda Saxla</button>
        </div>
      </div>

      <div class="edit-card">
        <button id="ban-btn" class="btn" onclick="toggleBan()"></button>
      </div>
    </div>

  </div>

  <script>
    const ADMIN_PIN = "1234";
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allUsers = [];
    let currentEditUserId = null;
    let currentEditUserBanned = false;

    // Login
    function checkPin() {
      if (document.getElementById('pin-code').value === ADMIN_PIN) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        fetchUsers();
      } else { alert("Yanlış şifrə!"); }
    }

    // Görünüşləri Dəyişmək
    function switchView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // Bütün Məlumatları Götür
    function fetchUsers() {
      db.collection('users').onSnapshot(snapshot => {
        allUsers = [];
        let activeCount = 0;
        
        snapshot.forEach(doc => {
          let data = doc.data();
          data.id = doc.id;
          allUsers.push(data);
          if (!data.isBanned) activeCount++;
        });

        document.getElementById('active-users-count').innerText = activeCount;
        renderUserList();

        // Əgər hazırda kimsə redaktə edilirsə, məlumatlarını real-time yenilə
        if (currentEditUserId) {
          let updatedUser = allUsers.find(u => u.id === currentEditUserId);
          if (updatedUser) populateEditView(updatedUser);
        }
      });
    }

    // Siyahını və Axtarışı Tərtib Et
    function renderUserList() {
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      const container = document.getElementById('users-list-container');
      container.innerHTML = '';

      const filtered = allUsers.filter(u => u.id.toLowerCase().includes(searchVal));

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#666; margin-top:20px;">İstifadəçi tapılmadı.</div>';
        return;
      }

      filtered.forEach(user => {
        const div = document.createElement('div');
        div.className = 'user-list-item';
        div.onclick = () => openEdit(user);
        
        const dotClass = user.isBanned ? 'dot-banned' : 'dot-active';
        const bal = Number(user.balance || 0).toFixed(2);
        
        div.innerHTML = `
          <div>
            <span class="user-status-dot ${dotClass}"></span>
            <span style="font-weight:bold;">${user.id}</span>
          </div>
          <div style="color:#00e676; font-weight:bold;">${bal} ₼</div>
        `;
        container.appendChild(div);
      });
    }

    // Redaktə Səhifəsini Aç
    function openEdit(user) {
      currentEditUserId = user.id;
      populateEditView(user);
      switchView('view-edit');
    }

    function populateEditView(user) {
      currentEditUserBanned = user.isBanned || false;
      document.getElementById('edit-user-id').innerText = user.id;
      
      const statusTxt = document.getElementById('edit-status-text');
      if (currentEditUserBanned) {
        statusTxt.innerHTML = '<span style="color:#ff0055; font-weight:bold;">Status: BLOKLANIB</span>';
      } else {
        statusTxt.innerHTML = '<span style="color:#00e676; font-weight:bold;">Status: Aktiv</span>';
      }

      // Əgər istifadəçi özü input-a nəsə yazırsa real-time yeniləmə onu pozmasın deyə kiçik yoxlama:
      if(document.activeElement.id !== 'edit-balance') {
        document.getElementById('edit-balance').value = Number(user.balance || 0).toFixed(2);
      }
      if(document.activeElement.id !== 'edit-rate') {
        document.getElementById('edit-rate').value = user.winRate !== undefined ? user.winRate : 50;
      }

      const banBtn = document.getElementById('ban-btn');
      if (currentEditUserBanned) {
        banBtn.className = "btn btn-blue";
        banBtn.innerText = "Banı Qaldır";
      } else {
        banBtn.className = "btn btn-red";
        banBtn.innerText = "İstifadəçini Blokla";
      }
    }

    // Şans + / -
    function adjustRate(delta) {
      const input = document.getElementById('edit-rate');
      let val = parseInt(input.value) || 0;
      val = Math.max(0, Math.min(100, val + delta));
      input.value = val;
    }

    // Baza Yeniləmələri
    function saveBalance() {
      let val = parseFloat(document.getElementById('edit-balance').value);
      if (isNaN(val)) return alert("Düzgün məbləğ yazın!");
      db.collection('users').doc(currentEditUserId).update({ balance: val });
    }

    function saveRate() {
      let val = parseInt(document.getElementById('edit-rate').value);
      if (isNaN(val) || val < 0 || val > 100) return alert("Şans 0-100 arası olmalıdır!");
      db.collection('users').doc(currentEditUserId).update({ winRate: val });
    }

    function toggleBan() {
      db.collection('users').doc(currentEditUserId).update({ isBanned: !currentEditUserBanned });
    }
  </script>
</body>
</html>
