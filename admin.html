<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Diva Casino - Admin Panel</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0b0b10; color: #fff; padding: 20px; }
    h1 { color: #ff007f; text-align: center; margin-bottom: 20px; text-transform: uppercase; }
    
    .stats-container { display: flex; gap: 15px; margin-bottom: 20px; }
    .stat-box { flex: 1; background: #16161e; border: 1px solid #222230; border-radius: 10px; padding: 15px; text-align: center; }
    .stat-title { font-size: 12px; color: #aaa; text-transform: uppercase; font-weight: bold; }
    .stat-val { font-size: 24px; font-weight: 900; color: #00e676; margin-top: 5px; }
    
    table { width: 100%; border-collapse: collapse; background: #16161e; border-radius: 10px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222230; font-size: 14px; }
    th { background: #1f1f2e; color: #ff007f; text-transform: uppercase; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .dot-online { background: #00e676; box-shadow: 0 0 8px #00e676; }
    .dot-offline { background: #ff3d00; box-shadow: 0 0 8px #ff3d00; }
    
    input[type=number] { width: 80px; padding: 5px; background: #0b0b10; color: #fff; border: 1px solid #555; border-radius: 5px; }
    button { padding: 6px 12px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
    .btn-save { background: #2979ff; color: #fff; }
    .btn-ban { background: #ff3d00; color: #fff; }
    .btn-unban { background: #00e676; color: #fff; }
  </style>
</head>
<body>

  <h1>Diva Casino - İdarəetmə Paneli</h1>

  <div class="stats-container">
    <div class="stat-box">
      <div class="stat-title">Ümumi Oyunçular</div>
      <div class="stat-val" id="total-users">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-title">Aktiv (Onlayn) Oyunçular</div>
      <div class="stat-val" style="color: #ff007f;" id="active-users">0</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Status</th>
        <th>İstifadəçi ID</th>
        <th>Balans (AZN)</th>
        <th>Uduş Şansı (%)</th>
        <th>Bloklanma</th>
        <th>Əməliyyat</th>
      </tr>
    </thead>
    <tbody id="user-table-body"></tbody>
  </table>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("users").onSnapshot(snapshot => {
      const tbody = document.getElementById("user-table-body");
      tbody.innerHTML = "";
      
      let totalUsers = 0;
      let activeUsers = 0;
      const now = Date.now();

      snapshot.forEach(doc => {
        totalUsers++;
        const user = doc.data();
        const uid = doc.id;
        
        // Son aktivlik 60 saniyədən (60000ms) azdırsa istifadəçi Onlayn (Yaşıl) sayılır
        const isOnline = user.lastActive && (now - user.lastActive < 60000);
        if (isOnline) activeUsers++;
        
        const statusDot = isOnline ? '<span class="dot dot-online" title="Aktiv"></span>' : '<span class="dot dot-offline" title="Oflayn"></span>';
        const banBtn = user.isBanned 
          ? `<button class="btn-unban" onclick="toggleBan('${uid}', false)">Blokdan Çıxar</button>` 
          : `<button class="btn-ban" onclick="toggleBan('${uid}', true)">Blokla</button>`;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${statusDot} ${isOnline ? 'Aktiv' : 'Oflayn'}</td>
          <td style="font-weight:bold;">${uid}</td>
          <td><input type="number" id="bal_${uid}" value="${user.balance || 0}" step="1"></td>
          <td><input type="number" id="win_${uid}" value="${user.winRate || 50}" step="1" max="100"></td>
          <td>${user.isBanned ? '<span style="color:#ff3d00;">Bəli</span>' : '<span style="color:#00e676;">Xeyr</span>'}</td>
          <td>
            <button class="btn-save" onclick="updateUser('${uid}')">Yadda Saxla</button>
            ${banBtn}
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("total-users").innerText = totalUsers;
      document.getElementById("active-users").innerText = activeUsers;
    });

    window.updateUser = (uid) => {
      const bal = parseFloat(document.getElementById(`bal_${uid}`).value);
      const win = parseFloat(document.getElementById(`win_${uid}`).value);
      db.collection("users").doc(uid).update({ balance: bal, winRate: win });
    };

    window.toggleBan = (uid, status) => {
      db.collection("users").doc(uid).update({ isBanned: status });
    };

    // Səhifəni reallıqda vaxtaşırı olaraq yenilə ki, statuslar dəyişəndə (oflayn olanda) görünsün
    setInterval(() => {
      // Firebase onSnapshot olduğu üçün öz-özünü yeniləyir, amma sırf vaxt fərqinə görə oflayn statusunu yoxlamaq üçün kiçik refresh
      db.collection("users").doc("dummy").get(); 
    }, 15000);
  </script>
</body>
</html>
