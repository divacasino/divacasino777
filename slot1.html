<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash'in Fruits 100 Diva</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0b10; color: #fff; padding-bottom: 30px; text-align: center; }
    
    header { background: #16161e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff007f; }
    .back-btn { background: #222230; color: #fff; border: 1px solid #ff007f; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }
    .balance-badge { background: linear-gradient(135deg, #ff007f, #7928ca); padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }

    .slot-container { max-width: 520px; margin: 20px auto; background: #16161e; border-radius: 20px; padding: 20px; border: 2px solid #222230; box-shadow: 0 0 25px rgba(255, 0, 127, 0.2); }
    
    .game-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .game-logo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ff007f; box-shadow: 0 0 10px #ff007f; object-fit: cover; }
    .game-title { color: #ff007f; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }

    /* 5x3 Grid Formatı */
    .reels-grid {
      background: #000;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #ff007f;
      position: relative;
      margin-bottom: 20px;
    }

    .cell {
      height: 70px;
      background: #1f1f2e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 1px solid #33334d;
      transition: transform 0.1s, background 0.3s;
      user-select: none;
    }

    .spinning { animation: blurSpin 0.1s infinite linear; }

    @keyframes blurSpin {
      0% { transform: translateY(-4px) scaleY(1.1); filter: blur(2px); opacity: 0.7; }
      50% { transform: translateY(4px) scaleY(0.9); filter: blur(3px); opacity: 0.5; }
      100% { transform: translateY(-4px) scaleY(1.1); filter: blur(2px); opacity: 0.7; }
    }

    .cell.win-cell {
      background: #2e7d32 !important;
      border-color: #00e676 !important;
      animation: winPulse 0.6s infinite alternate ease-in-out;
    }

    @keyframes winPulse {
      0% { transform: scale(1); box-shadow: 0 0 5px #00e676; }
      100% { transform: scale(1.08); box-shadow: 0 0 20px #00e676; }
    }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #0b0b10; padding: 10px; border-radius: 12px; }
    .bet-btn { background: #ff007f; color: #fff; border: none; width: 35px; height: 35px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .bet-input { background: #1f1f2e; border: 1px solid #ff007f; color: #00e676; width: 80px; text-align: center; padding: 6px; border-radius: 8px; font-weight: bold; font-size: 16px; outline: none; }

    .spin-btn {
      width: 100%; background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #fff; border: none; padding: 15px; border-radius: 12px;
      font-size: 18px; font-weight: 900; letter-spacing: 1px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4); text-transform: uppercase;
    }
    .spin-btn:active { transform: scale(0.98); }
    .spin-btn:disabled { background: #444; box-shadow: none; cursor: not-allowed; }

    .msg-box { margin-top: 15px; min-height: 45px; font-weight: bold; font-size: 15px; line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">← Lobby</a>
    <div class="balance-badge"><span id="balance-val">0.00</span> AZN</div>
  </header>

  <div class="slot-container">
    
    <div class="game-header">
      <img src="https://i.ibb.co/6R2145v/image-4.png" alt="Cash'in Fruits" class="game-logo">
      <div class="game-title">Cash'in Fruits 100</div>
    </div>

    <!-- 5x3 Xanalar -->
    <div class="reels-grid">
      <!-- 3 Sira, 5 Sutun -->
      <script>
        for(let r=0; r<3; r++) {
          for(let c=0; c<5; c++) {
            document.write(`<div class="cell" id="c_${r}_${c}">🍒</div>`);
          }
        }
      </script>
    </div>

    <div class="controls">
      <button class="bet-btn" onclick="adjustBet(-0.20)">-</button>
      <div>Mərc: <input type="number" id="bet-input" class="bet-input" value="0.20" step="0.10" onchange="validateBet()"> AZN</div>
      <button class="bet-btn" onclick="adjustBet(0.20)">+</button>
    </div>

    <button class="spin-btn" id="spin-btn" onclick="spin()">FIRLAT 🎰</button>
    <div class="msg-box" id="msg-box"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Böyük əmsallı simvolların şansını azaltmaq üçün çəkili siyahı (Weighted Array)
    const fruitPool = ['🍒', '🍒', '🍒', '🍋', '🍋', '🍋', '🍇', '🍇', '🔔', '🔔', '💎', '7️⃣'];
    const multipliers = { '🍒': 2, '🍋': 3, '🍇': 5, '🔔': 8, '💎': 15, '7️⃣': 25 };

    let currentBalance = 0;
    let userWinRate = 50; 

    let userId = localStorage.getItem('diva_user_id');
    if (!userId) {
      userId = 'USER_' + Math.floor(100000 + Math.random() * 900000);
      localStorage.setItem('diva_user_id', userId);
    }

    db.collection('users').doc(userId).onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        if (data.isBanned) {
          document.body.innerHTML = "<h1 style='color:#ff007f; margin-top:100px;'>HESABINIZ BLOKLANIB!</h1>";
          return;
        }
        currentBalance = data.balance || 0;
        userWinRate = data.winRate !== undefined ? data.winRate : 50;
        document.getElementById('balance-val').innerText = Number(currentBalance).toFixed(2);
      } else {
        db.collection('users').doc(userId).set({ balance: 0, winRate: 50, isBanned: false, createdAt: new Date() });
      }
    });

    function adjustBet(val) {
      const input = document.getElementById('bet-input');
      let currentBet = parseFloat(input.value) || 0.20;
      currentBet = Math.max(0.10, Math.round((currentBet + val) * 100) / 100);
      input.value = currentBet.toFixed(2);
    }

    function validateBet() {
      const input = document.getElementById('bet-input');
      let val = parseFloat(input.value);
      if (isNaN(val) || val < 0.10) input.value = "0.10";
    }

    function clearWinEffects() {
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 5; c++) {
          document.getElementById(`c_${r}_${c}`).classList.remove('win-cell', 'spinning');
        }
      }
    }

    function getRandomFruit() {
      return fruitPool[Math.floor(Math.random() * fruitPool.length)];
    }

    function spin() {
      const currentBet = parseFloat(document.getElementById('bet-input').value) || 0.20;
      if (currentBalance < currentBet) {
        document.getElementById('msg-box').style.color = "#ff007f";
        document.getElementById('msg-box').innerText = "Kifayət qədər balans yoxdur!";
        return;
      }

      currentBalance -= currentBet;
      db.collection('users').doc(userId).update({ balance: currentBalance });

      const spinBtn = document.getElementById('spin-btn');
      spinBtn.disabled = true;
      clearWinEffects();
      document.getElementById('msg-box').innerText = "";

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 5; c++) {
          document.getElementById(`c_${r}_${c}`).classList.add('spinning');
        }
      }

      let counter = 0;
      const interval = setInterval(() => {
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 5; c++) {
            document.getElementById(`c_${r}_${c}`).innerText = getRandomFruit();
          }
        }
        counter++;

        if (counter > 15) {
          clearInterval(interval);
          clearWinEffects();
          checkWin(currentBet);
          spinBtn.disabled = false;
        }
      }, 70);
    }

    function checkWin(currentBet) {
      const randomNumber = Math.floor(Math.random() * 100) + 1;
      const isWinner = randomNumber <= userWinRate;

      if (isWinner) {
        // Çarpaz və ya düz xətt seçimi (Düz: sıra 0, 1, 2; Çarpaz: yuxarıdan-aşağıya və ya aşağıdan-yuxarıya)
        const lineTypes = ['horizontal', 'diagonal_down', 'diagonal_up'];
        const chosenLine = lineTypes[Math.floor(Math.random() * lineTypes.length)];
        const winSymbol = getRandomFruit();
        let winningCells = [];

        if (chosenLine === 'horizontal') {
          const row = Math.floor(Math.random() * 3);
          for (let c = 0; c < 5; c++) winningCells.push([row, c]);
        } else if (chosenLine === 'diagonal_down') {
          winningCells = [[0,0], [1,1], [2,2], [1,3], [0,4]];
        } else {
          winningCells = [[2,0], [1,1], [0,2], [1,3], [2,4]];
        }

        winningCells.forEach(([r, c]) => {
          const cell = document.getElementById(`c_${r}_${c}`);
          cell.innerText = winSymbol;
          cell.classList.add('win-cell');
        });

        const mult = multipliers[winSymbol] || 3;
        const winAmount = currentBet * mult;
        currentBalance += winAmount;
        db.collection('users').doc(userId).update({ balance: currentBalance });

        document.getElementById('msg-box').style.color = "#00e676";
        document.getElementById('msg-box').innerHTML = `🎉 UDUŞ! +${winAmount.toFixed(2)} AZN (${winSymbol} x${mult})<br><span style="color:#fff; font-size:13px;">Balans: ${currentBalance.toFixed(2)} AZN</span>`;
      } else {
        document.getElementById('msg-box').style.color = "#aaa";
        document.getElementById('msg-box').innerText = "Bəxtinizi bir daha sınayın!";
      }
    }
  </script>
</body>
</html>
