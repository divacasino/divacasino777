<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diva Slot</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
    body { background: #0b0b10; color: #fff; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
    
    header { display: flex; justify-content: center; align-items: center; padding: 15px; position: relative; background: rgba(22, 22, 30, 0.9); border-bottom: 1px solid #ff007f; }
    .logo-img { height: 40px; }
    .back-btn { position: absolute; left: 15px; color: #fff; font-size: 24px; cursor: pointer; text-decoration: none; }
    .balance-box { position: absolute; right: 15px; text-align: right; }
    .balance-val { color: #00e676; font-weight: bold; font-size: 16px; }
    .user-id { font-size: 10px; color: #888; }

    .game-container { flex: 1; display: flex; padding: 10px; gap: 10px; }
    .paytable-marquee { width: 80px; background: #16161e; border: 1px solid #222230; border-radius: 10px; overflow: hidden; position: relative; }
    .paytable-content { position: absolute; top: 100%; width: 100%; text-align: center; animation: scrollUp 15s linear infinite; font-size: 12px; color: #aaa; }
    .paytable-content div { margin-bottom: 15px; }
    .paytable-content span { color: #ff007f; font-weight: bold; }
    @keyframes scrollUp { to { top: -150%; } }

    .slot-machine { flex: 1; background: #1a1a2e; border: 2px solid #ff007f; border-radius: 15px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 10px; position: relative; }
    .reel-col { display: flex; flex-direction: column; gap: 5px; }
    .slot-item { flex: 1; background: #0b0b10; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 30px; border: 1px solid #333; transition: transform 0.1s; }
    .slot-item.win { background: rgba(255, 0, 127, 0.3); border-color: #ff007f; transform: scale(1.1); z-index: 10; box-shadow: 0 0 15px #ff007f; }

    .controls { padding: 15px; background: rgba(22, 22, 30, 0.9); display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #222230; }
    .bet-row { display: flex; justify-content: space-between; align-items: center; }
    .bet-controls { display: flex; align-items: center; gap: 5px; background: #0b0b10; padding: 5px; border-radius: 8px; border: 1px solid #333; }
    .bet-btn { background: #333; color: #fff; border: none; width: 30px; height: 30px; border-radius: 5px; font-size: 18px; cursor: pointer; }
    .bet-input { background: transparent; border: none; color: #fff; width: 60px; text-align: center; font-size: 16px; font-weight: bold; outline: none; }
    
    .spin-btn { background: linear-gradient(45deg, #ff007f, #ff4500); color: #fff; border: none; padding: 15px; border-radius: 10px; font-size: 20px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 5px 15px rgba(255,0,127,0.4); }
    .spin-btn:active { transform: scale(0.98); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #win-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: bold; color: #00e676; text-shadow: 0 0 20px #000; pointer-events: none; opacity: 0; transition: 0.3s; z-index: 100; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">❮</a>
    <img src="logo.png.PNG" alt="Logo" class="logo-img" onerror="this.style.display='none'; this.outerHTML='<h2 style=\'color:#ff007f; margin:0;\'>DIVA</h2>'">
    <div class="balance-box">
      <div class="user-id">ID: <span id="u-id">-----</span></div>
      <div class="balance-val" id="u-balance">0.00 ₼</div>
    </div>
  </header>

  <div class="game-container">
    <div class="paytable-marquee">
      <div class="paytable-content">
        <div>🍒<br>3x: <span>2x</span><br>4x: <span>5x</span><br>5x: <span>10x</span></div>
        <div>🍋<br>3x: <span>3x</span><br>4x: <span>8x</span><br>5x: <span>15x</span></div>
        <div>🍇<br>3x: <span>5x</span><br>4x: <span>15x</span><br>5x: <span>30x</span></div>
        <div>🔔<br>3x: <span>10x</span><br>4x: <span>25x</span><br>5x: <span>50x</span></div>
        <div>💎<br>3x: <span>20x</span><br>4x: <span>50x</span><br>5x: <span>100x</span></div>
        <div>7️⃣<br>3x: <span>50x</span><br>4x: <span>100x</span><br>5x: <span>250x</span></div>
      </div>
    </div>
    
    <div class="slot-machine" id="grid">
      <!-- 5 columns, 3 rows generated by JS -->
    </div>
    <div id="win-overlay">+0.00</div>
  </div>

  <div class="controls">
    <div class="bet-row">
      <span>Mərc:</span>
      <div class="bet-controls">
        <button class="bet-btn" onclick="changeBet(-0.1)">-</button>
        <input type="number" id="bet-amount" class="bet-input" value="0.50" step="0.1" min="0.1">
        <button class="bet-btn" onclick="changeBet(0.1)">+</button>
      </div>
    </div>
    <button class="spin-btn" id="spin-btn" onclick="spin()">FIRLAT</button>
  </div>

  <script>
    // Firebase Setup
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Player Setup
    let userId = localStorage.getItem('diva_id');
    if (!userId) {
      userId = Math.floor(10000 + Math.random() * 90000).toString();
      localStorage.setItem('diva_id', userId);
    }
    document.getElementById('u-id').innerText = userId;

    let balance = 0;
    let winChance = 20; // Admin set

    db.collection("users").doc(userId).onSnapshot(doc => {
      if (doc.exists) {
        balance = doc.data().balance || 0;
        winChance = doc.data().winRate !== undefined ? doc.data().winRate : 20;
        document.getElementById('u-balance').innerText = balance.toFixed(2) + " ₼";
        db.collection("users").doc(userId).update({ lastActive: Date.now(), currentGame: "Slot Oyununda" });
      } else {
        db.collection("users").doc(userId).set({ balance: 0, winRate: 20, lastActive: Date.now(), currentGame: "Slot Oyununda" });
      }
    });

    const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '7️⃣'];
    const multipliers = { '🍒': [0,0,2,5,10], '🍋': [0,0,3,8,15], '🍇': [0,0,5,15,30], '🔔': [0,0,10,25,50], '💎': [0,0,20,50,100], '7️⃣': [0,0,50,100,250] };
    const gridEl = document.getElementById('grid');
    let gridData = [[],[],[],[],[]]; // 5 cols, 3 rows

    // Initialize Grid
    function createGrid() {
      gridEl.innerHTML = '';
      for (let c = 0; c < 5; c++) {
        let col = document.createElement('div');
        col.className = 'reel-col';
        for (let r = 0; r < 3; r++) {
          let cell = document.createElement('div');
          cell.className = 'slot-item';
          cell.id = `cell-${c}-${r}`;
          cell.innerText = symbols[Math.floor(Math.random() * symbols.length)];
          col.appendChild(cell);
        }
        gridEl.appendChild(col);
      }
    }
    createGrid();

    function changeBet(val) {
      let betInp = document.getElementById('bet-amount');
      let current = parseFloat(betInp.value) || 0;
      let newBet = Math.max(0.1, current + val);
      betInp.value = newBet.toFixed(2);
    }

    // Advanced Paylines (Representing the 27 lines from images)
    // Matrix: [x,y] where x=col(0-4), y=row(0-2)
    const paylines = [
      [[0,1],[1,1],[2,1],[3,1],[4,1]], // Middle straight
      [[0,0],[1,0],[2,0],[3,0],[4,0]], // Top straight
      [[0,2],[1,2],[2,2],[3,2],[4,2]], // Bottom straight
      [[0,0],[1,1],[2,2],[3,1],[4,0]], // V shape
      [[0,2],[1,1],[2,0],[3,1],[4,2]], // Inverted V
      [[0,0],[1,0],[2,1],[3,2],[4,2]], // Zigzag 1
      [[0,2],[1,2],[2,1],[3,0],[4,0]], // Zigzag 2
      // ... Add remaining 20 lines mathematically mirroring the images
    ];

    async function spin() {
      let bet = parseFloat(document.getElementById('bet-amount').value);
      if (bet > balance || bet <= 0) return alert("Balans yetərsizdir!");
      
      document.getElementById('spin-btn').disabled = true;
      document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('win'));
      
      // Deduct bet
      await db.collection("users").doc(userId).update({ balance: firebase.firestore.FieldValue.increment(-bet) });

      // Determine Win based on chance
      let isWin = (Math.random() * 100) < winChance;
      
      // Animation simulation
      let spins = 0;
      let spinInterval = setInterval(() => {
        for(let c=0; c<5; c++) {
          for(let r=0; r<3; r++) {
            document.getElementById(`cell-${c}-${r}`).innerText = symbols[Math.floor(Math.random() * symbols.length)];
          }
        }
        spins++;
        if(spins > 15) {
          clearInterval(spinInterval);
          finalizeSpin(isWin, bet);
        }
      }, 50);
    }

    function finalizeSpin(forceWin, bet) {
      // Logic to populate gridData and force a win on a random payline if forceWin is true
      let resultGrid = [];
      for(let c=0; c<5; c++) {
        let col = [];
        for(let r=0; r<3; r++) col.push(symbols[Math.floor(Math.random() * symbols.length)]);
        resultGrid.push(col);
      }

      if(forceWin) {
        let line = paylines[Math.floor(Math.random() * paylines.length)];
        let winSymbol = symbols[Math.floor(Math.random() * symbols.length)];
        let matchCount = Math.floor(Math.random() * 3) + 3; // 3, 4, or 5 matches
        for(let i=0; i<matchCount; i++) {
          resultGrid[line[i][0]][line[i][1]] = winSymbol;
        }
      }

      // Render
      for(let c=0; c<5; c++) {
        for(let r=0; r<3; r++) {
          document.getElementById(`cell-${c}-${r}`).innerText = resultGrid[c][r];
        }
      }

      checkWins(resultGrid, bet);
    }

    function checkWins(grid, bet) {
      let totalWin = 0;
      let winCells = new Set();

      paylines.forEach(line => {
        let sym = grid[line[0][0]][line[0][1]];
        let count = 1;
        for(let i=1; i<5; i++) {
          if(grid[line[i][0]][line[i][1]] === sym) count++;
          else break;
        }
        if(count >= 3) {
          let multiplier = multipliers[sym][count-1];
          totalWin += bet * multiplier;
          for(let i=0; i<count; i++) winCells.add(`cell-${line[i][0]}-${line[i][1]}`);
        }
      });

      if(totalWin > 0) {
        winCells.forEach(id => document.getElementById(id).classList.add('win'));
        let overlay = document.getElementById('win-overlay');
        overlay.innerText = "+" + totalWin.toFixed(2) + " ₼";
        overlay.style.opacity = 1;
        setTimeout(() => overlay.style.opacity = 0, 2000);
        db.collection("users").doc(userId).update({ balance: firebase.firestore.FieldValue.increment(totalWin) });
      }
      
      document.getElementById('spin-btn').disabled = false;
    }
  </script>
</body>
</html>
