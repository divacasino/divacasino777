<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cash'in Fruits 100 - Diva Casino</title>

  <!-- PWA & Apple Meta -->
  <link rel="icon" type="image/png" href="logo.png.PNG">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: #07070a; 
      color: #ffffff; 
      padding-bottom: 30px; 
      overflow-x: hidden; 
    }

    /* Header */
    header { background: #16161e; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222230; position: sticky; top: 0; z-index: 1000; height: 55px; }
    .back-btn { background: #222230; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 12px; text-decoration: none; display: flex; align-items: center; gap: 5px; }
    .user-panel { display: flex; align-items: center; gap: 10px; }
    .balance-box { text-align: right; }
    .user-id-txt { font-size: 10px; color: #8888a0; font-weight: 700; }
    .user-bal-txt { font-size: 14px; font-weight: 900; color: #00e676; }

    .container { padding: 12px; max-width: 500px; margin: 0 auto; display: flex; flexDirection: column; gap: 12px; }

    /* Oyun Başlığı (Jackpot / Üst Banner) */
    .slot-top-banner {
      background: linear-gradient(90deg, #1a0505, #3d0a0a, #1a0505);
      border: 1px solid #ff3d0055;
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      color: #ff9100;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: inset 0 0 10px rgba(255, 61, 0, 0.2);
    }

    /* Slot Grid - Közərən Arxa Fon və Sütunlar */
    .slot-machine {
      background: #0f0202;
      border: 2px solid #ff007f;
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3), inset 0 0 30px rgba(0,0,0,0.8);
    }

    .slot-grid { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      gap: 4px; 
      background: linear-gradient(180deg, #1f0505 0%, #3a0808 50%, #1f0505 100%);
      border-radius: 8px; 
      padding: 6px;
      box-shadow: inset 0 0 15px rgba(255, 69, 0, 0.4);
    }
    
    .slot-cell { 
      background: rgba(12, 12, 18, 0.85); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 6px; 
      aspect-ratio: 1/1; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 28px; 
      transition: transform 0.1s ease;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.6);
    }

    .slot-cell.winner {
      border-color: #00e676;
      background: rgba(0, 230, 118, 0.15);
      box-shadow: 0 0 12px #00e676;
    }

    /* Mərc Paneli */
    .bet-panel {
      background: #16161e;
      border: 1px solid #222230;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bet-label { font-size: 10px; font-weight: 800; color: #8888a0; text-align: center; letter-spacing: 0.5px; }
    
    .bet-controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    
    .bet-btn { background: #222230; color: #fff; border: none; width: 40px; height: 38px; border-radius: 8px; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.1s; }
    .bet-btn:active { transform: scale(0.92); background: #333346; }

    .bet-display { background: #0b0b10; border: 1px solid #2f2f42; border-radius: 8px; flex: 1; text-align: center; font-size: 16px; font-weight: 900; color: #00e676; padding: 8px; }

    /* Fırlat Düyməsi */
    .spin-btn { 
      background: linear-gradient(180deg, #00e676 0%, #00c853 100%); 
      color: #07070a; 
      border: none; 
      width: 100%; 
      padding: 14px; 
      border-radius: 10px; 
      font-size: 16px; 
      font-weight: 950; 
      cursor: pointer; 
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
      transition: 0.15s;
    }
    .spin-btn:active { transform: scale(0.97); opacity: 0.9; }
    .spin-btn:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

    /* Qazanc Bildirişi */
    .win-popup {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%) scale(0.5);
      background: rgba(0, 230, 118, 0.95);
      color: #07070a;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 950;
      box-shadow: 0 5px 25px rgba(0,230,118,0.6);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .win-popup.show {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">⬅ Geri</a>
    <div class="user-panel">
      <div class="balance-box">
        <div class="user-id-txt">ID: <span id="display-user-id">----</span></div>
        <div class="user-bal-txt" id="display-user-balance">0.00 AZN</div>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- Üst Kazino Başlığı -->
    <div class="slot-top-banner">
      🔥 CASH'IN FRUITS 100 - HOT SEVENS EDITION 🔥
    </div>

    <!-- Slot Ekranı (Közərən Sütunlar) -->
    <div class="slot-machine">
      <div class="slot-grid" id="slot-grid">
        <!-- 15 Xana (5 sütun x 3 sətir) JavaScript ilə doldurulacaq -->
      </div>
    </div>

    <!-- Mərc İdarəetmə Paneli -->
    <div class="bet-panel">
      <div class="bet-label">MƏRC MƏBLƏĞİ (AZN)</div>
      <div class="bet-controls">
        <button class="bet-btn" onclick="changeBet(-0.20)">-</button>
        <div class="bet-display" id="bet-amount">0.20</div>
        <button class="bet-btn" onclick="changeBet(0.20)">+</button>
      </div>
    </div>

    <!-- Fırlat Düyməsi -->
    <button class="spin-btn" id="spin-button" onclick="spinSlot()">Fırlat</button>

  </div>

  <!-- Qazanc Popup Elementi -->
  <div class="win-popup" id="win-popup">TƏBRİKLƏR! +<span id="win-amount-txt">0.00</span> AZN</div>

  <script>
    // Firebase Konfiqurasiyası
    const firebaseConfig = {
      apiKey: "AIzaSyDVpLxlBl9U-UTT9wGDluUdNkPgkRBKDfA",
      authDomain: "diva-casino.firebaseapp.com",
      projectId: "diva-casino",
      storageBucket: "diva-casino.firebasestorage.app",
      messagingSenderId: "406269257311",
      appId: "1:406269257311:web:ef51aa13ccdcd73fff9dea"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userId = localStorage.getItem('diva_user_id') || '1000';
    document.getElementById('display-user-id').innerText = userId;

    let userBalance = 0;
    let currentBet = 0.20;

    // Meyvələr və simvollar (Emoji və ya Şəkil olaraq)
    const symbols = ['🍉', '🍋', '🍊', '🍒', '7️⃣'];

    // Gridin ilkin yaradılması (15 xana)
    const gridEl = document.getElementById('slot-grid');
    for (let i = 0; i < 15; i++) {
      const cell = document.createElement('div');
      cell.className = 'slot-cell';
      cell.id = `cell-${i}`;
      cell.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      gridEl.appendChild(cell);
    }

    // Balansı Firebase-dən oxumaq
    db.collection('users').doc(userId).onSnapshot(doc => {
      if (doc.exists) {
        userBalance = doc.data().balance || 0;
        document.getElementById('display-user-balance').innerText = userBalance.toFixed(2) + " AZN";
      }
    });

    function changeBet(amount) {
      currentBet = Math.max(0.20, parseFloat((currentBet + amount).toFixed(2)));
      document.getElementById('bet-amount').innerText = currentBet.toFixed(2);
    }

    async function spinSlot() {
      if (userBalance < currentBet) {
        alert("Balansınızda kifayət qədər vəsatət yoxdur! Zəhmət olmasa depozit edin.");
        return;
      }

      const spinBtn = document.getElementById('spin-button');
      spinBtn.disabled = true;

      // Balansdan mərcin çıxılması
      userBalance -= currentBet;
      await db.collection('users').doc(userId).update({ balance: userBalance, currentGame: "Cash'in Fruits 100" });

      // Köhnə qazanc işarələrini təmizlə
      for (let i = 0; i < 15; i++) {
        document.getElementById(`cell-${i}`).classList.remove('winner');
      }

      // Fırlanma animasiyası (təsadüfi simvolların sürətli dəyişməsi)
      let counter = 0;
      const spinInterval = setInterval(() => {
        for (let i = 0; i < 15; i++) {
          document.getElementById(`cell-${i}`).innerText = symbols[Math.floor(Math.random() * symbols.length)];
        }
        counter++;
        if (counter > 12) {
          clearInterval(spinInterval);
          finalizeSpin();
        }
      }, 80);
    }

    async function finalizeSpin() {
      // Son nəticənin formalaşdırılması
      const finalSymbols = [];
      for (let i = 0; i < 15; i++) {
        const sym = symbols[Math.floor(Math.random() * symbols.length)];
        finalSymbols.push(sym);
        document.getElementById(`cell-${i}`).innerText = sym;
      }

      // Sadə qazanc yoxlaması (Məsələn, eyni simvoldan 3 və ya daha çox düşərsə)
      let winMultiplier = 0;
      
      // Sadə alqoritm: hər hansı simvol sayına baxaq
      const counts = {};
      finalSymbols.forEach(s => counts[s] = (counts[s] || 0) + 1);

      for (let sym in counts) {
        if (counts[sym] >= 3) {
          winMultiplier = counts[sym] === 5 ? 10 : (counts[sym] === 4 ? 5 : 2);
          // Qazanan xanaları işarələyək
          for (let i = 0; i < 15; i++) {
            if (finalSymbols[i] === sym) {
              document.getElementById(`cell-${i}`).classList.add('winner');
            }
          }
        }
      }

      if (winMultiplier > 0) {
        const winAmount = currentBet * winMultiplier;
        userBalance += winAmount;
        await db.collection('users').doc(userId).update({ balance: userBalance });

        // Popup göstər
        document.getElementById('win-amount-txt').innerText = winAmount.toFixed(2);
        const popup = document.getElementById('win-popup');
        popup.classList.add('show');
        setTimeout(() => popup.classList.remove('show'), 2500);
      }

      document.getElementById('spin-button').disabled = false;
    }
  </script>
</body>
</html>
